<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page introuvable — Jeux d'Antonin Atger</title>
<script>
  /* GitHub Pages sert ce fichier pour toute adresse absente sous /jeux/.
     Le Fakemètre n'est pas dans ce dépôt (il a le sien, antoninatger/fakemetre) :
     son adresse est antoninatger.com/jeux/fakemetre/. Mais « github.io/jeux/fakemetre/ »
     se devine facilement et tombait sur un 404 nu. On y renvoie, en gardant
     le reste du chemin, ?lang= et #. */
  (function () {
    var p = decodeURIComponent(location.pathname);
    var m = p.match(/^\/jeux\/fakem[eè]tre(\/.*)?$/i);
    if (m) location.replace('https://antoninatger.com/jeux/fakemetre' + encodeURI(m[1] || '/') + location.search + location.hash);
  })();
</script>
<style>
  :root{ --bg:#0b1220; --card:#121c30; --txt:#eef3fb; --doux:#a3b3ca; --acc:#38bdf8; --acc-txt:#06121c; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
    font-family:system-ui,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--txt); }
  main{ max-width:520px; width:100%; background:var(--card); border-radius:16px; padding:28px 24px; text-align:center; }
  h1{ margin:0 0 12px; font-size:1.6rem; }
  p{ margin:0 0 20px; color:var(--doux); line-height:1.5; font-size:1rem; }
  a.bouton{ display:inline-block; padding:12px 20px; border-radius:10px; background:var(--acc); color:var(--acc-txt);
    font-weight:700; text-decoration:none; }
  a.bouton:focus-visible{ outline:3px solid var(--txt); outline-offset:3px; }
</style>
</head>
<body>
<main>
  <h1 id="t">Cette page n'existe pas (ou plus)</h1>
  <p id="p">Le jeu a peut-être changé d'adresse. Tous les jeux sont sur le portail.</p>
  <a class="bouton" id="b" href="https://antoninatger.github.io/jeux/">Voir tous les jeux</a>
</main>
<script>
  if (/^en/i.test(navigator.language || '') && !/^\/jeux\/fakem/i.test(decodeURIComponent(location.pathname))) {
    document.documentElement.lang = 'en';
    document.title = 'Page not found — Antonin Atger’s games';
    document.getElementById('t').textContent = 'This page doesn’t exist (anymore)';
    document.getElementById('p').textContent = 'The game may have moved. All the games are on the portal.';
    var b = document.getElementById('b'); b.textContent = 'See all games'; b.href = 'https://antoninatger.github.io/jeux/?lang=en';
  }
</script>
</body>
</html>
