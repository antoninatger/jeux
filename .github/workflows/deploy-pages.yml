name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
      # antoninatger.com/jeux recopie les jeux libres au moment où le dépôt
      # « site » se reconstruit : on le relance tout de suite, au lieu
      # d'attendre sa tâche horaire (que GitHub espace parfois de plusieurs
      # heures). Sans le secret SITE_TOKEN, l'étape est simplement sautée.
      - name: Reconstruire antoninatger.com
        env:
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
        run: |
          [ -n "$SITE_TOKEN" ] || { echo "::warning title=antoninatger.com pas reconstruit::Secret SITE_TOKEN absent : le site ne se mettra à jour qu'à sa prochaine reconstruction planifiée."; exit 0; }
          curl -fsS -X POST \
            -H "Authorization: Bearer $SITE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/antoninatger/site/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main"}'
