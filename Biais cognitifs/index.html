<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perceptio — le laboratoire des biais cognitifs</title>
<meta name="description" content="Catalogue interactif des biais cognitifs : définitions, exemples, QCM et exercices d'identification, sources scientifiques vérifiées.">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../collection.css">
<style>
  :root{
    /* Identité Perceptio sur le socle (chantier 05) : le socle impose la
       structure, l'échelle typographique et le contraste, ces jetons portent
       la direction artistique — sobre, sérif, cobalt sur gris clair. On ne
       converge pas vers l'arcade : Perceptio reste un laboratoire. */
    --bg:#E7EAF0;
    --txt:#10131C;
    --txt-secondaire:#565B66;   /* 5,6:1 sur --bg — mesuré */
    --acc:#2B4CFF;
    --acc-txt:#FFFFFF;
    --bordure:#C9CEDA;
    /* Le jaune de focus du socle est pensé pour les fonds sombres de la
       collection ; sur ce gris clair il ne contraste pas. Le rôle est
       surchargé, la règle du socle reste la seule. */
    --focus:#2B4CFF;
    --font-texte:'Source Serif 4',serif;
    --font-titre:'Space Grotesk',sans-serif;

    /* Noms historiques de la page : conservés en alias des rôles ci-dessus
       plutôt que réécrits partout — la feuille en compte une centaine
       d'usages, et un renommage rendrait la revue impossible. */
    --surface:#FFFFFF;
    --border:var(--bordure);
    --ink:var(--txt);
    --ink-dim:var(--txt-secondaire);
    --cobalt:var(--acc);

    --bg-deep:#10131C;
    --cobalt-soft:#DCE3FF;
    --lime:#D6FF3F;
    --wrong:#FF4D6D;
    --wrong-soft:#FFE1E7;
    --good:#17B890;
    --good-soft:#E4F9F1;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'Source Serif 4',serif;
    -webkit-font-smoothing:antialiased;
  }
  .disp{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 24px 100px;}
  a{color:inherit;}

  /* ---------- collection: en-tête du socle ----------
     Ni pastille de retour, ni bouton FR/EN, ni bloc de focus, ni
     prefers-reduced-motion ici : collection.css et collection.js les
     portent une seule fois pour toute la collection. Ce qui reste, c'est
     l'habillage de la marque dans l'emplacement « extra » de l'en-tête. */
  .col-entete__extra > .brand{
    font-family:var(--font-titre);font-weight:700;font-size:var(--fs-300);
    letter-spacing:-.01em;color:var(--txt);padding:0 var(--sp-3);
  }
  .col-entete__extra > .brand:hover{color:var(--acc);}

  /* ---------- topbar ---------- */
  .topbar{max-width:1080px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:21px;letter-spacing:-.01em;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--cobalt);display:inline-block;}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;}
  .tab{
    font-family:'Space Grotesk',sans-serif;font-weight:600;
    font-size:var(--fs-200);background:none;border:1.5px solid transparent;color:var(--ink-dim);
    padding:9px 15px;border-radius:20px;cursor:pointer;transition:all .15s ease;text-decoration:none;
  }
  .tab:hover{border-color:var(--border);}
  .tab.active{background:var(--cobalt);color:#fff;}
  .rand-btn{font-family:'JetBrains Mono',monospace;font-size:var(--fs-100);font-weight:700;background:var(--ink);color:#fff;border:none;padding:9px 16px;border-radius:20px;cursor:pointer;white-space:nowrap;}
  .rand-btn:hover{background:var(--cobalt);}

  /* ---------- hero / illusion ---------- */
  .hero{
    background:var(--bg-deep);color:#EDEFF6;border-radius:6px;
    padding:clamp(28px,5vw,56px);margin-bottom:40px;
    display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;font-size:var(--fs-100);letter-spacing:.16em;text-transform:uppercase;
    color:var(--lime);margin:0 0 14px;
  }
  .hero h1{
    font-family:'Space Grotesk',sans-serif;font-weight:700;
    font-size:clamp(30px,4.2vw,46px);line-height:1.04;margin:0 0 16px;letter-spacing:-.01em;
  }
  .hero p.lead{font-size:15.5px;line-height:1.6;color:#B9BECC;max-width:420px;margin:0;}

  .illusion{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;}
  .demo-q{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14.5px;color:#EDEFF6;margin:0;max-width:300px;line-height:1.4;}
  .demo-choices{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .demo-btn{
    font-family:'JetBrains Mono',monospace;font-size:var(--fs-100);background:#232838;color:#D6DAE6;
    border:1.5px solid #3A4053;padding:8px 12px;border-radius:20px;cursor:pointer;transition:all .15s ease;
  }
  .demo-btn:hover{border-color:var(--lime);color:#fff;}
  .demo-btn.picked{background:var(--lime);color:#10131C;border-color:var(--lime);}
  .illusion-caption{font-family:'JetBrains Mono',monospace;font-size:var(--fs-100);color:#9DA3B4;text-align:center;max-width:320px;line-height:1.5;min-height:0;}
  .illusion-caption b{color:var(--lime);}

  /* ---------- home sections ---------- */
  .section-lab{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:var(--fs-200);letter-spacing:.03em;
    color:var(--ink);margin:0 0 14px;display:flex;align-items:center;gap:10px;
  }
  .section-lab::after{content:'';flex:1;height:1.5px;background:var(--border);}
  .home-block{margin-bottom:44px;}
  .cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px;}
  .btn-primary{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;background:var(--cobalt);color:#fff;border:none;padding:12px 22px;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-block;}
  .btn-primary:hover{background:#1d3add;}
  .btn-ghost{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;background:none;color:var(--ink);border:1.5px solid var(--border);padding:11px 20px;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-block;}
  .btn-ghost:hover{border-color:var(--cobalt);color:var(--cobalt);}

  /* ---------- cartes : grille du socle ----------
     Les deux grilles de la page (catégories, catalogue) passent sur
     .col-cartes / .col-carte, le composant de l'étape 3. Ce qui restait
     maison — .cat-grid, .catcard, .grid, .card — dupliquait la grille,
     le survol et la cible cliquable. Ne reste ici que ce qui porte
     l'identité : la catégorie en pleine couleur, la fiche en carte blanche
     à bandeau. Les deux variantes gardent leurs classes de couleur
     (.c-croyance…), qui l'emportent sur --surface par ordre de cascade. */
  .col-carte--cat{
    border:0;border-radius:10px;padding:22px 20px;color:#fff;gap:0;
  }
  .col-carte--cat .col-carte__titre{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:17px;margin:0 0 6px;}
  /* Sans opacite : a 92 % et 88 %, le blanc retombait a 4,0:1 et 3,8:1 sur les
     aplats, ce qui annulait l'assombrissement des couleurs juste au-dessus.
     La hierarchie tient deja par la taille, la police et la casse. */
  .col-carte--cat .col-carte__desc{font-size:var(--fs-200);color:inherit;line-height:1.5;margin:0 0 10px;}
  .col-carte--cat .count{font-family:'JetBrains Mono',monospace;font-size:var(--fs-100);text-transform:uppercase;letter-spacing:.05em;}

  /* ---------- tabs / views ---------- */
  section.view{display:none;}
  section.view.active{display:block;}

  /* ---------- catalogue / swatch grid ---------- */
  .searchbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;}
  .searchbar input[type="search"]{flex:1;min-width:200px;padding:11px 14px;border:1.5px solid var(--border);border-radius:6px;font-family:'Source Serif 4',serif;font-size:14.5px;background:#fff;color:var(--ink);}
  .searchbar select{padding:11px 14px;border:1.5px solid var(--border);border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:var(--fs-200);background:#fff;color:var(--ink);cursor:pointer;}
  .result-count{font-family:'JetBrains Mono',monospace;font-size:var(--fs-100);color:var(--ink-dim);margin-bottom:14px;text-transform:uppercase;letter-spacing:.04em;}

  /* Le catalogue tient des cartes plus larges que les catégories : la seule
     différence est la borne de la grille, déclarée en modificateur. */
  .col-cartes--catalogue{grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:16px;}
  .col-carte--fiche{
    position:relative;border-width:1.5px;border-left-width:1.5px;border-color:var(--border);border-radius:8px;
    padding:0;gap:0;overflow:hidden;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;
  }
  .col-carte--fiche:hover{border-color:var(--border);box-shadow:0 10px 24px -12px rgba(16,19,28,.25);}
  .swatch-top{height:54px;}
  .card-body{padding:18px 18px 20px;}
  .col-carte--fiche .col-carte__titre{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:18px;margin:0 0 8px;}
  .col-carte--fiche .col-carte__desc{font-size:14px;color:var(--ink-dim);line-height:1.5;margin:0 0 16px;font-style:italic;}
  /* La catégorie et la difficulté passent de 10,5 à 12,8 px : « Temps &
     probabilités » en capitales monospace ne tient plus sur une ligne avec
     la difficulté à côté. Le pied se replie plutôt que d'être rogné par
     l'overflow:hidden de la carte. */
  .card-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:var(--sp-1) var(--sp-2);font-family:'JetBrains Mono',monospace;font-size:var(--fs-100);color:var(--ink-dim);text-transform:uppercase;letter-spacing:.04em;}
  .badge-lu{position:absolute;top:10px;right:10px;background:var(--lime);color:#10131C;font-family:'JetBrains Mono',monospace;font-size:var(--fs-100);font-weight:700;padding:3px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.03em;}

  /* Les six aplats des cartes de catégorie portent du texte blanc. Quatre des
     six ne passaient pas : orange 2,05:1, sarcelle 2,53:1, rose 2,60:1, vert
     2,86:1 — et le violet à 4,43:1 juste sous le seuil. Seule la luminosité
     a été baissée : la teinte et la saturation sont intactes, la palette
     reste la même à l'œil, chaque couleur est maintenant à 4,7:1 au moins
     sur blanc. Le bleu #2B4CFF, déjà à 5,87:1, n'a pas bougé. */
  .c-croyance{background:#2B4CFF;} .c-memoire{background:#7455FA;}
  .c-social{background:#E40056;} .c-decision{background:#108366;}
  .c-confiance{background:#AA6200;} .c-temps{background:#547F2D;}

  .empty{text-align:center;padding:50px 20px;color:var(--ink-dim);font-size:14.5px;}

  /* ---------- fiche detail ---------- */
  .fiche-back{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:var(--fs-200);color:var(--ink-dim);text-decoration:none;margin-bottom:18px;font-weight:600;}
  .fiche-back:hover{color:var(--cobalt);}
  .fiche{background:var(--surface);border:1.5px solid var(--border);border-radius:8px;overflow:hidden;}
  .fiche-band{height:6px;}
  .fiche-inner{padding:40px clamp(20px,4vw,52px);}
  .fiche-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:24px;}
  .fiche-cat{font-family:'JetBrains Mono',monospace;font-size:var(--fs-100);letter-spacing:.1em;text-transform:uppercase;color:var(--cobalt);margin-bottom:8px;text-decoration:none;}
  .fiche h2{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(26px,4vw,36px);margin:0 0 4px;}
  .fiche .eng{font-style:italic;color:var(--ink-dim);font-size:14px;margin:0;}
  .diff-badge{
    font-family:'JetBrains Mono',monospace;font-size:var(--fs-100);letter-spacing:.05em;text-transform:uppercase;
    background:var(--cobalt-soft);color:var(--cobalt);padding:5px 12px;border-radius:20px;white-space:nowrap;
  }

  .label{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:var(--fs-200);letter-spacing:.03em;
    color:var(--ink);margin:0 0 12px;display:flex;align-items:center;gap:10px;
  }
  .label::after{content:'';flex:1;height:1.5px;background:var(--border);}

  .definition{font-size:16.5px;line-height:1.7;margin:0 0 34px;max-width:640px;}

  .examples{display:grid;gap:10px;margin-bottom:34px;}
  .example{display:flex;gap:14px;border:1.5px solid var(--border);border-radius:6px;padding:14px 16px;background:#FBFBFD;}
  .example .mark{width:8px;height:8px;border-radius:50%;background:var(--cobalt);flex-shrink:0;margin-top:7px;}
  .example strong{font-family:'Space Grotesk',sans-serif;display:block;font-size:14px;margin-bottom:3px;}
  .example span{font-size:13.5px;color:var(--ink-dim);line-height:1.5;}

  .test-box{border:1.5px solid var(--border);border-radius:8px;padding:22px 22px 20px;margin-bottom:20px;position:relative;background:#FBFBFD;}
  .test-q{font-size:15px;margin:0 0 16px;font-weight:400;}
  .choices{display:grid;gap:8px;}
  .choice{
    text-align:left;background:#fff;border:1.5px solid var(--border);color:var(--ink);
    padding:11px 14px;border-radius:6px;font-size:14px;cursor:pointer;font-family:'Source Serif 4',serif;
    transition:border-color .15s ease;width:100%;
  }
  .choice:hover:not(:disabled){border-color:var(--cobalt);}
  .choice.correct{border-color:var(--good);background:var(--good-soft);}
  .choice.wrong{border-color:var(--wrong);background:var(--wrong-soft);}
  .explain{font-size:13.5px;color:var(--ink-dim);margin-top:14px;line-height:1.55;display:none;}
  .explain.show{display:block;}

  .scan-ring{
    position:absolute;top:20px;right:22px;width:34px;height:34px;border-radius:50%;
    border:3px solid var(--cobalt);display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--cobalt);font-size:16px;
    transform:scale(0);opacity:0;transition:transform .4s cubic-bezier(.34,1.56,.64,1), opacity .2s ease;
  }
  .scan-ring.wrong{border-color:var(--wrong);color:var(--wrong);}
  .scan-ring.show{transform:scale(1);opacity:1;}

  .qcm-score{font-family:'JetBrains Mono',monospace;font-size:var(--fs-200);color:var(--ink-dim);margin:0 0 34px;}
  .qcm-score b{color:var(--cobalt);}

  .sources{display:grid;gap:14px;margin-bottom:34px;}
  .source{font-size:13.5px;color:var(--ink-dim);line-height:1.55;padding-left:16px;border-left:2px solid var(--cobalt);}
  .source b{color:var(--ink);font-weight:600;font-family:'Space Grotesk',sans-serif;}
  .source .meta{font-family:'JetBrains Mono',monospace;font-size:var(--fs-100);color:var(--cobalt);display:block;margin-bottom:3px;}
  .source a{color:var(--cobalt);}

  .related{display:flex;gap:8px;flex-wrap:wrap;}
  .related a{font-family:'JetBrains Mono',monospace;font-size:var(--fs-100);background:var(--cobalt-soft);color:var(--cobalt);padding:7px 13px;border-radius:20px;text-decoration:none;font-weight:600;transition:background .15s,color .15s;}
  .related a:hover{background:var(--cobalt);color:#fff;}

  /* ---------- identification libre ---------- */
  .id-card{background:var(--surface);border:1.5px solid var(--border);border-radius:8px;max-width:640px;overflow:hidden;}
  .id-band{height:6px;background:var(--lime);}
  .id-inner{padding:38px clamp(20px,4vw,50px);}
  .id-eyebrow{font-family:'JetBrains Mono',monospace;font-size:var(--fs-100);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);margin:0 0 16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .id-situation{font-size:16.5px;line-height:1.7;margin:0 0 26px;}
  /* Un <input> a une largeur intrinseque (≈ 20 caracteres) qui l'empeche de
     se comprimer : sans `min-width:0` il poussait le bouton « Valider » hors
     du cadre — 369 px mesures sur un ecran de 320. */
  .id-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px;}
  .id-input{flex:1;min-width:0;background:#FBFBFD;border:1.5px solid var(--border);color:var(--ink);padding:12px 14px;border-radius:6px;font-size:14.5px;font-family:'Source Serif 4',serif;}
  .id-btn{background:var(--cobalt);color:#fff;border:none;font-weight:600;padding:0 22px;border-radius:6px;cursor:pointer;font-size:14px;font-family:'Space Grotesk',sans-serif;}
  .id-btn:hover{background:#1d3add;}
  /* Seule surcharge de focus conservée : --focus vaut la couleur d'accent, or
     ce bouton EST en couleur d'accent — l'anneau du socle y disparaîtrait. */
  .id-btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px;}
  .id-feedback{font-size:13.5px;line-height:1.55;margin-top:16px;padding:14px 16px;border-radius:6px;display:none;font-family:'Source Serif 4',serif;}
  .id-feedback.hint{display:block;background:var(--cobalt-soft);border:1px solid var(--cobalt);}
  .id-feedback.correct{display:block;background:var(--good-soft);border:1px solid var(--good);}
  .id-feedback.reveal{display:block;background:var(--wrong-soft);border:1px solid var(--wrong);}
  .id-feedback b{font-family:'Space Grotesk',sans-serif;color:var(--cobalt);}
  .id-next{margin-top:18px;}

  /* ---------- quiz global ---------- */
  .quiz-progress{font-family:'JetBrains Mono',monospace;font-size:var(--fs-200);color:var(--ink-dim);margin-bottom:14px;text-transform:uppercase;letter-spacing:.04em;}
  .quiz-progress b{color:var(--cobalt);}
  .quiz-origin{font-family:'JetBrains Mono',monospace;font-size:var(--fs-100);color:var(--ink-dim);margin-top:10px;}
  .quiz-end{text-align:center;padding:50px 20px;background:var(--surface);border:1.5px solid var(--border);border-radius:8px;}
  .quiz-end .score{font-family:'Space Grotesk',sans-serif;font-size:52px;font-weight:700;color:var(--cobalt);margin:6px 0 10px;}
  .quiz-end p{color:var(--ink-dim);font-size:14.5px;max-width:420px;margin:0 auto 22px;line-height:1.55;}

  /* ---------- a-propos ---------- */
  .apropos p{font-size:15.5px;line-height:1.75;max-width:680px;margin:0 0 20px;}
  .apropos h2{font-family:'Space Grotesk',sans-serif;font-size:19px;margin:34px 0 12px;}

  footer{text-align:center;color:var(--ink-dim);font-size:.85rem;padding:40px 20px 60px;line-height:1.7;}
  footer a{color:var(--cobalt);text-decoration:none;font-weight:600;}
  footer a:hover{text-decoration:underline;}

  @media (max-width:640px){
    .hero{grid-template-columns:1fr;}
  }
</style>
</head>
<!-- Le titre de l'en-tête est déclaré, pas déduit : l'unique <h1> de la page
     est celui du hero, écrit par app.js dans #app et propre à la vue
     d'accueil. Le socle l'aurait pris pour titre de page sur « / » et rien du
     tout sur les autres routes. -->
<body data-col-retour="../index.html" data-col-titre-cle="titreEntete">

<div class="topbar">
  <a class="brand" href="#/" data-col-entete-extra><span class="dot"></span>Perceptio</a>
  <nav class="tabs" id="mainnav" data-i18n-aria-label="nav" aria-label="Navigation principale">
    <a class="tab" href="#/biais" data-i18n="tabExplore">Explorer</a>
    <a class="tab" href="#/categories" data-i18n="tabCategories">Catégories</a>
    <a class="tab" href="#/quiz" data-i18n="tabQuiz">Quiz</a>
    <a class="tab" href="#/identification" data-i18n="tabIdentification">Trouve le biais</a>
    <a class="tab" href="#/a-propos" data-i18n="tabAbout">À propos</a>
  </nav>
  <button class="rand-btn" id="rand-btn" type="button" data-i18n="randomBtn">🎲 Biais aléatoire</button>
</div>

<main id="app" class="wrap"></main>

<footer>
  <p><span data-i18n="by">par</span> <a href="https://antoninatger.com" target="_blank">Antonin Atger</a></p>
  <p class="mono" data-i18n="footerTag">Perceptio — {n} biais recensés à ce jour, sources scientifiques vérifiées une à une.</p>
</footer>

<script src="../i18n.js"></script>
<script>
I18N.register({
  fr: {
    titreEntete: "Biais cognitifs", nav: "Navigation principale",
    tabExplore: "Explorer", tabCategories: "Catégories", tabQuiz: "Quiz",
    tabIdentification: "Trouve le biais", tabAbout: "À propos",
    randomBtn: "🎲 Biais aléatoire", by: "par",
    footerTag: "Perceptio — {n} biais recensés à ce jour, sources scientifiques vérifiées une à une."
  },
  en: {
    titreEntete: "Cognitive biases", nav: "Main navigation",
    tabExplore: "Explore", tabCategories: "Categories", tabQuiz: "Quiz",
    tabIdentification: "Spot the bias", tabAbout: "About",
    randomBtn: "🎲 Random bias", by: "by",
    footerTag: "Perceptio — {n} biases catalogued so far, scientific sources verified one by one."
  }
