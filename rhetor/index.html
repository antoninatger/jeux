<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhetor — l'arsenal du discours</title>
<meta name="description" content="Catalogue interactif des outils rhétoriques : figures de style, sophismes et lexique de l'argumentation, avec exemples, QCM et sources vérifiées.">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../collection.css">
<style>
  :root{
    /* Identité Rhetor sur le socle (chantier 05) : le socle impose la
       structure, l'échelle typographique et le contraste, ces jetons portent
       la direction artistique — parchemin, sérif à empattements francs, grenat
       et or. */
    --bg:#F4EFE6;
    --txt:#211C15;
    --txt-secondaire:#6B6252;   /* 5,2:1 sur --bg — mesuré */
    --acc:#8C2F39;
    --acc-txt:#FFFFFF;
    --bordure:#DAD0BC;
    /* Le jaune de focus du socle est pensé pour les fonds sombres de la
       collection ; sur ce parchemin il ne contraste pas. Le rôle est
       surchargé, la règle du socle reste la seule. */
    --focus:#8C2F39;
    --font-texte:'Source Serif 4',serif;
    --font-titre:'Fraunces',serif;

    /* Noms historiques de la page : conservés en alias des rôles ci-dessus
       plutôt que réécrits partout — la feuille en compte une centaine
       d'usages, et un renommage rendrait la revue impossible. */
    --surface:#FFFFFF;
    --border:var(--bordure);
    --ink:var(--txt);
    --ink-dim:var(--txt-secondaire);
    --accent:var(--acc);

    --bg-deep:#1F1B16;
    --accent-soft:#F1DCDD;
    --gold:#C9932E;
    --gold-soft:#F7EAD2;
    --wrong:#C1443B;
    --wrong-soft:#F7E1DD;
    --good:#3F7D58;
    --good-soft:#E1EEE4;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'Source Serif 4',serif;
    -webkit-font-smoothing:antialiased;
  }
  .disp{font-family:'Fraunces',serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 24px 100px;}
  a{color:inherit;}

  /* ---------- collection: en-tête du socle ----------
     Ni pastille de retour, ni bouton FR/EN, ni bloc de focus, ni
     prefers-reduced-motion ici : collection.css et collection.js les
     portent une seule fois pour toute la collection. Ce qui reste, c'est
     l'habillage de la marque dans l'emplacement « extra » de l'en-tête. */
  .col-entete__extra > .brand{
    font-family:var(--font-titre);font-weight:600;font-size:var(--fs-300);
    letter-spacing:-.01em;color:var(--txt);padding:0 var(--sp-3);
  }
  .col-entete__extra > .brand:hover{color:var(--acc);}

  /* ---------- topbar ---------- */
  .topbar{max-width:1080px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .brand{font-family:'Fraunces',serif;font-weight:600;font-size:22px;letter-spacing:-.01em;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;}
  .tab{
    font-family:'Fraunces',serif;font-weight:600;
    font-size:var(--fs-200);background:none;border:1.5px solid transparent;color:var(--ink-dim);
    padding:9px 15px;border-radius:20px;cursor:pointer;transition:all .15s ease;text-decoration:none;
    /* 44 px de haut : la cible tactile que le socle impose partout
       ailleurs. Les onglets en faisaient 38. */
    min-height:44px;display:inline-flex;align-items:center;
  }
  .tab:hover{border-color:var(--border);}
  .tab.active{background:var(--accent);color:#fff;}
  .rand-btn{font-family:'JetBrains Mono',monospace;font-size:var(--fs-100);font-weight:700;background:var(--ink);color:#fff;border:none;padding:9px 16px;border-radius:20px;cursor:pointer;white-space:nowrap;min-height:44px;display:inline-flex;align-items:center;}
  .rand-btn:hover{background:var(--accent);}

  /* ---------- hero / demo ---------- */
  .hero{
    background:var(--bg-deep);color:#F1ECE2;border-radius:6px;
    padding:clamp(28px,5vw,56px);margin-bottom:40px;
    display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;font-size:var(--fs-100);letter-spacing:.16em;text-transform:uppercase;
    color:var(--gold);margin:0 0 14px;
  }
  .hero h1{
    font-family:'Fraunces',serif;font-weight:600;
    font-size:clamp(28px,4vw,44px);line-height:1.08;margin:0 0 16px;letter-spacing:-.01em;
  }
  .hero p.lead{font-size:15.5px;line-height:1.6;color:#C9C0B2;max-width:420px;margin:0;}

  .duel{display:flex;flex-direction:column;gap:10px;}
  .duel-q{font-family:'Fraunces',serif;font-weight:600;font-size:14.5px;color:#F1ECE2;margin:0 0 4px;line-height:1.4;}
  .duel-opt{
    text-align:left;font-family:'Source Serif 4',serif;font-style:italic;font-size:14.5px;
    background:#2A2419;color:#EDE6D8;border:1.5px solid #443B2C;padding:14px 16px;border-radius:8px;cursor:pointer;
    transition:all .15s ease;line-height:1.5;
  }
  .duel-opt:hover{border-color:var(--gold);}
  .duel-opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
  .duel-opt.picked{background:var(--gold);color:#1F1B16;border-color:var(--gold);font-style:normal;font-family:'JetBrains Mono',monospace;font-size:var(--fs-200);font-weight:600;}
  .duel-result{font-family:'JetBrains Mono',monospace;font-size:var(--fs-200);color:#C9C0B2;line-height:1.6;min-height:0;margin:2px 0 0;}
  .duel-result b{color:var(--gold);}

  /* ---------- home sections ---------- */
  .section-lab{
    font-family:'Fraunces',serif;font-weight:600;font-size:var(--fs-200);letter-spacing:.02em;
    color:var(--ink);margin:0 0 14px;display:flex;align-items:center;gap:10px;
  }
  .section-lab::after{content:'';flex:1;height:1.5px;background:var(--border);}
  .home-block{margin-bottom:44px;}
  .cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px;}
  .btn-primary{font-family:'Fraunces',serif;font-weight:600;font-size:14.5px;background:var(--accent);color:#fff;border:none;padding:12px 22px;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-block;}
  .btn-primary:hover{background:#701F28;}
  .btn-ghost{font-family:'Fraunces',serif;font-weight:600;font-size:14.5px;background:none;color:var(--ink);border:1.5px solid var(--border);padding:11px 20px;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-block;}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent);}

  /* ---------- cartes : grille du socle ----------
     Les deux grilles de la page (catégories, catalogue) passent sur
     .col-cartes / .col-carte, le composant de l'étape 3. Ce qui restait
     maison — .cat-grid, .catcard, .grid, .card — dupliquait la grille,
     le survol et la cible cliquable. Ne reste ici que ce qui porte
     l'identité : la catégorie en pleine couleur, la fiche en carte blanche
     à bandeau. Les deux variantes gardent leurs classes de couleur
     (.c-figures…), qui l'emportent sur --surface par ordre de cascade. */
  .col-carte--cat{
    border:0;border-radius:10px;padding:22px 20px;color:#fff;gap:0;
  }
  .col-carte--cat .col-carte__titre{font-family:'Fraunces',serif;font-weight:600;font-size:18px;margin:0 0 6px;}
  .col-carte--cat .col-carte__desc{font-size:var(--fs-200);color:inherit;opacity:.92;line-height:1.5;margin:0 0 10px;}
  .col-carte--cat .count{font-family:'JetBrains Mono',monospace;font-size:var(--fs-100);opacity:.88;text-transform:uppercase;letter-spacing:.05em;}

  /* ---------- tabs / views ---------- */
  section.view{display:none;}
  section.view.active{display:block;}

  /* ---------- catalogue / grid ---------- */
  .searchbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;}
  .searchbar input[type="search"]{flex:1;min-width:200px;padding:11px 14px;border:1.5px solid var(--border);border-radius:6px;font-family:'Source Serif 4',serif;font-size:14.5px;background:#fff;color:var(--ink);}
  .searchbar select{padding:11px 14px;border:1.5px solid var(--border);border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:var(--fs-200);background:#fff;color:var(--ink);cursor:pointer;}
  .result-count{font-family:'JetBrains Mono',monospace;font-size:var(--fs-100);color:var(--ink-dim);margin-bottom:14px;text-transform:uppercase;letter-spacing:.04em;}

  /* Le catalogue tient des cartes plus larges que les catégories : la seule
     différence est la borne de la grille, déclarée en modificateur. */
  .col-cartes--catalogue{grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:16px;}
  .col-carte--fiche{
    position:relative;border-width:1.5px;border-left-width:1.5px;border-color:var(--border);border-radius:8px;
    padding:0;gap:0;overflow:hidden;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;
  }
  .col-carte--fiche:hover{border-color:var(--border);box-shadow:0 10px 24px -12px rgba(31,27,22,.25);}
  .swatch-top{height:54px;}
  .card-body{padding:18px 18px 20px;}
  .col-carte--fiche .col-carte__titre{font-family:'Fraunces',serif;font-weight:600;font-size:18.5px;margin:0 0 8px;}
  .col-carte--fiche .col-carte__desc{font-size:14px;color:var(--ink-dim);line-height:1.5;margin:0 0 16px;font-style:italic;}
  /* La catégorie et la difficulté passent de 10,5 à 12,8 px : « FIGURES DE
     STYLE » en capitales monospace ne tient plus sur une ligne avec la
     difficulté à côté. Le pied se replie plutôt que d'être rogné par
     l'overflow:hidden de la carte. */
  .card-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:var(--sp-1) var(--sp-2);font-family:'JetBrains Mono',monospace;font-size:var(--fs-100);color:var(--ink-dim);text-transform:uppercase;letter-spacing:.04em;}
  .badge-lu{position:absolute;top:10px;right:10px;background:var(--gold);color:#1F1B16;font-family:'JetBrains Mono',monospace;font-size:var(--fs-100);font-weight:700;padding:3px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.03em;}

  .c-figures{background:#C9932E;} .c-sophismes{background:#A6303D;} .c-lexique{background:#2F6F76;}

  .empty{text-align:center;padding:50px 20px;color:var(--ink-dim);font-size:14.5px;}

  /* ---------- fiche detail ---------- */
  .fiche-back{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:var(--fs-200);color:var(--ink-dim);text-decoration:none;margin-bottom:18px;font-weight:600;}
  .fiche-back:hover{color:var(--accent);}
  .fiche{background:var(--surface);border:1.5px solid var(--border);border-radius:8px;overflow:hidden;}
  .fiche-band{height:6px;}
  .fiche-inner{padding:40px clamp(20px,4vw,52px);}
  .fiche-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:24px;}
  .fiche-cat{font-family:'JetBrains Mono',monospace;font-size:var(--fs-100);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;text-decoration:none;display:inline-block;}
  .fiche h2{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(26px,4vw,36px);margin:0 0 4px;}
  .fiche .eng{font-style:italic;color:var(--ink-dim);font-size:14px;margin:0;}
  .diff-badge{
    font-family:'JetBrains Mono',monospace;font-size:var(--fs-100);letter-spacing:.05em;text-transform:uppercase;
    background:var(--accent-soft);color:var(--accent);padding:5px 12px;border-radius:20px;white-space:nowrap;
  }

  .label{
    font-family:'Fraunces',serif;font-weight:600;font-size:var(--fs-200);letter-spacing:.02em;
    color:var(--ink);margin:0 0 12px;display:flex;align-items:center;gap:10px;
  }
  .label::after{content:'';flex:1;height:1.5px;background:var(--border);}

  .definition{font-size:16.5px;line-height:1.75;margin:0 0 34px;max-width:640px;}

  .examples{display:grid;gap:10px;margin-bottom:34px;}
  .example{display:flex;gap:14px;border:1.5px solid var(--border);border-radius:6px;padding:14px 16px;background:#FBF8F2;}
  .example .mark{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:7px;}
  .example strong{font-family:'Fraunces',serif;display:block;font-size:14.5px;margin-bottom:3px;}
  .example span{font-size:13.5px;color:var(--ink-dim);line-height:1.5;}

  .test-box{border:1.5px solid var(--border);border-radius:8px;padding:22px 22px 20px;margin-bottom:20px;position:relative;background:#FBF8F2;}
  .test-q{font-size:15px;margin:0 0 16px;font-weight:400;}
  .choices{display:grid;gap:8px;}
  .choice{
    text-align:left;background:#fff;border:1.5px solid var(--border);color:var(--ink);
    padding:11px 14px;border-radius:6px;font-size:14px;cursor:pointer;font-family:'Source Serif 4',serif;
    transition:border-color .15s ease;width:100%;
  }
  .choice:hover:not(:disabled){border-color:var(--accent);}
  .choice:disabled{cursor:default;}
  .choice.correct{border-color:var(--good);background:var(--good-soft);}
  .choice.wrong{border-color:var(--wrong);background:var(--wrong-soft);}
  .explain{font-size:13.5px;color:var(--ink-dim);margin-top:14px;line-height:1.55;display:none;}
  .explain.show{display:block;}

  .scan-ring{
    position:absolute;top:20px;right:22px;width:34px;height:34px;border-radius:50%;
    border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:700;color:var(--accent);font-size:16px;
    transform:scale(0);opacity:0;transition:transform .4s cubic-bezier(.34,1.56,.64,1), opacity .2s ease;
  }
  .scan-ring.wrong{border-color:var(--wrong);color:var(--wrong);}
  .scan-ring.show{transform:scale(1);opacity:1;}

  .qcm-score{font-family:'JetBrains Mono',monospace;font-size:var(--fs-200);color:var(--ink-dim);margin:0 0 34px;}
  .qcm-score b{color:var(--accent);}

  .sources{display:grid;gap:14px;margin-bottom:34px;}
  .source{font-size:13.5px;color:var(--ink-dim);line-height:1.55;padding-left:16px;border-left:2px solid var(--accent);}
  .source b{color:var(--ink);font-weight:600;font-family:'Fraunces',serif;}
  .source .meta{font-family:'JetBrains Mono',monospace;font-size:var(--fs-100);color:var(--accent);display:block;margin-bottom:3px;}
  .source a{color:var(--accent);}

  .related{display:flex;gap:8px;flex-wrap:wrap;}
  .related a{font-family:'JetBrains Mono',monospace;font-size:var(--fs-100);background:var(--accent-soft);color:var(--accent);padding:7px 13px;border-radius:20px;text-decoration:none;font-weight:600;transition:background .15s,color .15s;}
  .related a:hover{background:var(--accent);color:#fff;}

  /* ---------- identification libre ---------- */
  .id-card{background:var(--surface);border:1.5px solid var(--border);border-radius:8px;max-width:640px;overflow:hidden;}
  .id-band{height:6px;background:var(--gold);}
  .id-inner{padding:38px clamp(20px,4vw,50px);}
  .id-eyebrow{font-family:'JetBrains Mono',monospace;font-size:var(--fs-100);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);margin:0 0 16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .id-situation{font-size:16.5px;line-height:1.75;margin:0 0 26px;}
  /* Un <input> a une largeur intrinseque (≈ 20 caracteres) qui l'empeche de
     se comprimer : sans `min-width:0` il poussait le bouton « Valider » hors
     du cadre sur un ecran de 320 px. */
  .id-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px;}
  .id-input{flex:1;min-width:0;background:#FBF8F2;border:1.5px solid var(--border);color:var(--ink);padding:12px 14px;border-radius:6px;font-size:14.5px;font-family:'Source Serif 4',serif;}
  .id-btn{background:var(--accent);color:#fff;border:none;font-weight:600;padding:0 22px;border-radius:6px;cursor:pointer;font-size:14px;font-family:'Fraunces',serif;}
  .id-btn:hover{background:#701F28;}
  /* Seules surcharges de focus conservees : --focus vaut la couleur d'accent,
     or ce bouton EST en couleur d'accent (et .duel-opt est sur le hero
     sombre) — l'anneau du socle y disparaitrait. */
  .id-btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px;}
  .id-feedback{font-size:13.5px;line-height:1.55;margin-top:16px;padding:14px 16px;border-radius:6px;display:none;font-family:'Source Serif 4',serif;}
  .id-feedback.hint{display:block;background:var(--accent-soft);border:1px solid var(--accent);}
  .id-feedback.correct{display:block;background:var(--good-soft);border:1px solid var(--good);}
  .id-feedback.reveal{display:block;background:var(--wrong-soft);border:1px solid var(--wrong);}
  .id-feedback b{font-family:'Fraunces',serif;color:var(--accent);}
  .id-next{margin-top:18px;}

  /* ---------- quiz global ---------- */
  .quiz-progress{font-family:'JetBrains Mono',monospace;font-size:var(--fs-200);color:var(--ink-dim);margin-bottom:14px;text-transform:uppercase;letter-spacing:.04em;}
  .quiz-progress b{color:var(--accent);}
  .quiz-origin{font-family:'JetBrains Mono',monospace;font-size:var(--fs-100);color:var(--ink-dim);margin-top:10px;}
  .quiz-end{text-align:center;padding:50px 20px;background:var(--surface);border:1.5px solid var(--border);border-radius:8px;}
  .quiz-end .score{font-family:'Fraunces',serif;font-size:52px;font-weight:700;color:var(--accent);margin:6px 0 10px;}
  .quiz-end p{color:var(--ink-dim);font-size:14.5px;max-width:420px;margin:0 auto 22px;line-height:1.55;}

  /* ---------- a-propos ---------- */
  .apropos p{font-size:15.5px;line-height:1.75;max-width:680px;margin:0 0 20px;}
  .apropos h2{font-family:'Fraunces',serif;font-size:19px;margin:34px 0 12px;}

  footer{text-align:center;color:var(--ink-dim);font-size:.85rem;padding:40px 20px 60px;line-height:1.7;}
  footer a{color:var(--accent);text-decoration:none;font-weight:600;}
  footer a:hover{text-decoration:underline;}

  @media (max-width:640px){
    .hero{grid-template-columns:1fr;}
  }
</style>
</head>
<!-- Le titre de l'en-tête est déclaré, pas déduit : l'unique <h1> de la page
     est celui du hero, écrit par app.js dans #app et propre à la vue
     d'accueil. Le socle l'aurait pris pour titre de page sur « / » et rien du
     tout sur les autres routes. -->
<body data-col-retour="../index.html" data-col-titre-cle="titreEntete">

<div class="topbar">
  <!-- L'en-tête du socle affiche déjà le nom du catalogue : la pastille
     ne faisait que le répéter. Elle garde son rôle, qui est le retour
     à l'accueil du catalogue. -->
  <a class="brand" href="#/" data-col-entete-extra><span class="dot"></span><span data-i18n="accueil">Accueil</span></a>
  <nav class="tabs" id="mainnav" data-i18n-aria-label="nav" aria-label="Navigation principale">
    <a class="tab" href="#/outils" data-i18n="tabExplore">Explorer</a>
    <a class="tab" href="#/categories" data-i18n="tabCategories">Catégories</a>
    <a class="tab" href="#/quiz" data-i18n="tabQuiz">Quiz</a>
    <a class="tab" href="#/identification" data-i18n="tabIdentification">Repère l'outil</a>
    <a class="tab" href="#/a-propos" data-i18n="tabAbout">À propos</a>
  </nav>
  <button class="rand-btn" id="rand-btn" type="button" data-i18n="randomBtn">🎲 Outil aléatoire</button>
</div>

<main id="app" class="wrap"></main>

<footer>
  <p><span data-i18n="by">par</span> <a href="https://antoninatger.com" target="_blank">Antonin Atger</a></p>
  <p class="mono" data-i18n="footerTag">Rhetor — {n} outils recensés à ce jour, sources vérifiées une à une.</p>
</footer>

<script src="../i18n.js"></script>
<script>
I18N.register({
  fr: {
    titreEntete: "Outils rhétoriques", nav: "Navigation principale", accueil: "Accueil",
    tabExplore: "Explorer", tabCategories: "Catégories", tabQuiz: "Quiz",
    tabIdentification: "Repère l'outil", tabAbout: "À propos",
    randomBtn: "🎲 Outil aléatoire", by: "par",
    footerTag: "Rhetor — {n} outils recensés à ce jour, sources vérifiées une à une."
  },
  en: {
    titreEntete: "Rhetorical tools", nav: "Main navigation", accueil: "Home",
    tabExplore: "Explore", tabCategories: "Categories", tabQuiz: "Quiz",
    tabIdentification: "Spot the tool", tabAbout: "About",
    randomBtn: "🎲 Random tool", by: "by",
    footerTag: "Rhetor — {n} tools catalogued so far, sources verified one by one."
  }
});
document.write('<scr' + 'ipt src="' + (I18N.lang === 'en' ? 'data-en.js' : 'data.js') + '"><\/scr' + 'ipt>');
</script>
<!-- Le moteur est commun aux trois catalogues (tâche E3) : Rhetor ne déclare
     ici que ce qui lui est propre — ses routes, ses champs, sa démonstration
     d'accueil et son vocabulaire. -->
<script src="../catalogue.js"></script>
<script>
Catalogue.demarrer({
  jeu: 'rhetor',
  route: 'outils',
  cleProgression: 'rhetor-vus',
  items: OUTILS,
  categories: CATEGORIES,

  champs: {
    resume: 'definition_courte',
