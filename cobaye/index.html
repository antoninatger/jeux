<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cobaye — les expériences qui ont fait la psychologie</title>
<meta name="description" content="Dix expériences de psychologie parmi les plus célèbres : histoire, découvertes, controverses et sources vérifiées.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ECEAE4;
    --bg-deep:#14171A;
    --surface:#FFFFFF;
    --border:#D2CFC6;
    --ink:#17181A;
    --ink-dim:#5C5B54;
    --accent:#B0402A;
    --accent-soft:#F3DCD3;
    --wrong:#C1443B;
    --wrong-soft:#F7E1DD;
    --good:#3F7D58;
    --good-soft:#E1EEE4;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'Source Serif 4',serif;
    -webkit-font-smoothing:antialiased;
  }
  .disp{font-family:'Special Elite',monospace;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 24px 100px;}
  a{color:inherit;}

  /* ---------- collection: retour hub + a11y ---------- */
  .back-hub{position:fixed;top:12px;left:12px;z-index:9999;display:inline-flex;align-items:center;gap:5px;background:rgba(20,23,26,.85);border:1px solid rgba(255,255,255,.15);color:#ECEAE4;text-decoration:none;font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:600;padding:7px 14px;border-radius:50px;opacity:.9;transition:opacity .2s,transform .2s;backdrop-filter:blur(4px);}
  .back-hub:hover{opacity:1;transform:translateX(-2px);}
  :where(button,a,[tabindex],input,select,textarea):focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important;}}

  /* ---------- topbar ---------- */
  .topbar{max-width:1080px;margin:0 auto;padding:54px 24px 0;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .brand{font-family:'Special Elite',monospace;font-weight:400;font-size:20px;letter-spacing:-.01em;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;}
  .tab{
    font-family:'JetBrains Mono',monospace;font-weight:600;
    font-size:12.5px;background:none;border:1.5px solid transparent;color:var(--ink-dim);
    padding:9px 15px;border-radius:20px;cursor:pointer;transition:all .15s ease;text-decoration:none;
  }
  .tab:hover{border-color:var(--border);}
  .tab.active{background:var(--accent);color:#fff;}
  .rand-btn{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:700;background:var(--ink);color:#fff;border:none;padding:9px 16px;border-radius:20px;cursor:pointer;white-space:nowrap;}
  .rand-btn:hover{background:var(--accent);}

  /* ---------- hero / Asch demo ---------- */
  .hero{
    background:var(--bg-deep);color:#ECEAE4;border-radius:6px;
    padding:clamp(28px,5vw,56px);margin-bottom:40px;
    display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:#D2C9A0;margin:0 0 14px;
  }
  .hero h1{
    font-family:'Special Elite',monospace;font-weight:400;
    font-size:clamp(24px,3.6vw,36px);line-height:1.15;margin:0 0 16px;letter-spacing:-.01em;
  }
  .hero p.lead{font-size:15px;line-height:1.6;color:#C4BFB2;max-width:420px;margin:0;}

  .asch-demo{display:flex;flex-direction:column;gap:12px;}
  .asch-q{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:12.5px;color:#ECEAE4;margin:0;line-height:1.5;}
  .asch-ref{display:flex;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#9A958A;}
  .asch-bar{height:8px;background:#ECEAE4;border-radius:2px;display:inline-block;}
  .asch-votes{font-family:'JetBrains Mono',monospace;font-size:11px;color:#D2C9A0;margin:0;}
  .asch-votes b{color:var(--accent);background:#ECEAE4;padding:1px 6px;border-radius:3px;}
  .asch-choices{display:flex;flex-direction:column;gap:8px;}
  .asch-choice{
    display:flex;align-items:center;gap:12px;text-align:left;font-family:'JetBrains Mono',monospace;font-size:12.5px;
    background:#232019;color:#D6D2C6;border:1.5px solid #3A362C;padding:10px 14px;border-radius:6px;cursor:pointer;
    transition:all .15s ease;
  }
  .asch-choice:hover{border-color:#9A958A;}
  .asch-choice:focus-visible{outline:2px solid #D2C9A0;outline-offset:2px;}
  .asch-choice.picked{background:var(--accent);color:#fff;border-color:var(--accent);}
  .asch-choice.picked .asch-bar{background:#fff;}
  .asch-result{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#C4BFB2;line-height:1.6;margin:2px 0 0;}
  .asch-result b{color:#D2C9A0;}

  /* ---------- home sections ---------- */
  .section-lab{
    font-family:'Special Elite',monospace;font-weight:400;font-size:13px;letter-spacing:.02em;
    color:var(--ink);margin:0 0 14px;display:flex;align-items:center;gap:10px;
  }
  .section-lab::after{content:'';flex:1;height:1.5px;background:var(--border);}
  .home-block{margin-bottom:44px;}
  .cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px;}
  .btn-primary{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13px;background:var(--accent);color:#fff;border:none;padding:12px 22px;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-block;}
  .btn-primary:hover{background:#8E3220;}
  .btn-ghost{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13px;background:none;color:var(--ink);border:1.5px solid var(--border);padding:11px 20px;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-block;}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent);}

  .cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;}
  .catcard{border-radius:10px;padding:22px 20px;color:#fff;text-decoration:none;display:block;transition:transform .15s ease;}
  .catcard:hover{transform:translateY(-3px);}
  .catcard h3{font-family:'Special Elite',monospace;font-weight:400;font-size:17px;margin:0 0 6px;}
  .catcard p{font-size:12.5px;opacity:.92;line-height:1.5;margin:0 0 10px;}
  .catcard .count{font-family:'JetBrains Mono',monospace;font-size:10.5px;opacity:.88;text-transform:uppercase;letter-spacing:.05em;}

  /* ---------- tabs / views ---------- */
  section.view{display:none;}
  section.view.active{display:block;}

  /* ---------- catalogue / grid ---------- */
  .searchbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;}
  .searchbar input[type="search"]{flex:1;min-width:200px;padding:11px 14px;border:1.5px solid var(--border);border-radius:6px;font-family:'Source Serif 4',serif;font-size:14.5px;background:#fff;color:var(--ink);}
  .searchbar input[type="search"]:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .searchbar select{padding:11px 14px;border:1.5px solid var(--border);border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:12px;background:#fff;color:var(--ink);cursor:pointer;}
  .result-count{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-dim);margin-bottom:14px;text-transform:uppercase;letter-spacing:.04em;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:16px;}
  .card{
    position:relative;background:var(--surface);border:1.5px solid var(--border);border-radius:8px;
    padding:0;overflow:hidden;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;
    text-decoration:none;color:var(--ink);display:block;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 24px -12px rgba(20,23,26,.25);}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .swatch-top{height:54px;}
  .card-body{padding:18px 18px 20px;}
  .card h3{font-family:'Special Elite',monospace;font-weight:400;font-size:17px;margin:0 0 8px;line-height:1.3;}
  .card p{font-size:14px;color:var(--ink-dim);line-height:1.5;margin:0 0 16px;font-style:italic;}
  .card-foot{display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.04em;}
  .badge-lu{position:absolute;top:10px;right:10px;background:var(--accent);color:#fff;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;padding:3px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.03em;}

  .c-obeissance{background:#B0402A;} .c-conformisme{background:#6B7A5E;} .c-situations{background:#3D5A80;}
  .c-developpement{background:#8B5FBF;} .c-social{background:#C98A2C;} .c-memoire{background:#4A7A75;}

  .empty{text-align:center;padding:50px 20px;color:var(--ink-dim);font-size:14.5px;}

  /* ---------- fiche detail ---------- */
  .fiche-back{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-dim);text-decoration:none;margin-bottom:18px;font-weight:600;}
  .fiche-back:hover{color:var(--accent);}
  .fiche{background:var(--surface);border:1.5px solid var(--border);border-radius:8px;overflow:hidden;}
  .fiche-band{height:6px;}
  .fiche-inner{padding:40px clamp(20px,4vw,52px);}
  .fiche-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:10px;}
  .fiche-cat{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;text-decoration:none;display:inline-block;}
  .fiche h2{font-family:'Special Elite',monospace;font-weight:400;font-size:clamp(22px,3.4vw,30px);margin:0 0 4px;line-height:1.25;}
  .fiche .meta-line{font-style:italic;color:var(--ink-dim);font-size:14px;margin:0 0 24px;}
  .diff-badge{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
    background:var(--accent-soft);color:var(--accent);padding:5px 12px;border-radius:20px;white-space:nowrap;
  }

  .label{
    font-family:'Special Elite',monospace;font-weight:400;font-size:13px;letter-spacing:.02em;
    color:var(--ink);margin:0 0 12px;display:flex;align-items:center;gap:10px;
  }
  .label::after{content:'';flex:1;height:1.5px;background:var(--border);}

  .definition{font-size:16px;line-height:1.75;margin:0 0 34px;max-width:640px;}

  .controverse-box{border:1.5px solid var(--accent);border-left-width:5px;border-radius:6px;padding:20px 22px;margin-bottom:34px;background:var(--accent-soft);}
  .controverse-box p{font-size:14.5px;line-height:1.65;margin:0;max-width:640px;}
  .controverse-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:0 0 10px;font-weight:700;}

  .examples{display:grid;gap:10px;margin-bottom:34px;}
  .example{display:flex;gap:14px;border:1.5px solid var(--border);border-radius:6px;padding:14px 16px;background:#F7F5F0;}
  .example .mark{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:7px;}
  .example strong{font-family:'Special Elite',monospace;font-weight:400;display:block;font-size:14px;margin-bottom:3px;}
  .example span{font-size:13.5px;color:var(--ink-dim);line-height:1.5;}

  .test-box{border:1.5px solid var(--border);border-radius:8px;padding:22px 22px 20px;margin-bottom:20px;position:relative;background:#F7F5F0;}
  .test-q{font-size:15px;margin:0 0 16px;font-weight:400;}
  .choices{display:grid;gap:8px;}
  .choice{
    text-align:left;background:#fff;border:1.5px solid var(--border);color:var(--ink);
    padding:11px 14px;border-radius:6px;font-size:14px;cursor:pointer;font-family:'Source Serif 4',serif;
    transition:border-color .15s ease;width:100%;
  }
  .choice:hover:not(:disabled){border-color:var(--accent);}
  .choice:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .choice.correct{border-color:var(--good);background:var(--good-soft);}
  .choice.wrong{border-color:var(--wrong);background:var(--wrong-soft);}
  .explain{font-size:13.5px;color:var(--ink-dim);margin-top:14px;line-height:1.55;display:none;}
  .explain.show{display:block;}

  .scan-ring{
    position:absolute;top:20px;right:22px;width:34px;height:34px;border-radius:50%;
    border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;
    font-family:'Special Elite',monospace;font-weight:400;color:var(--accent);font-size:15px;
    transform:scale(0);opacity:0;transition:transform .4s cubic-bezier(.34,1.56,.64,1), opacity .2s ease;
  }
  .scan-ring.wrong{border-color:var(--wrong);color:var(--wrong);}
  .scan-ring.show{transform:scale(1);opacity:1;}

  .qcm-score{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-dim);margin:0 0 34px;}
  .qcm-score b{color:var(--accent);}

  .sources{display:grid;gap:14px;margin-bottom:34px;}
  .source{font-size:13.5px;color:var(--ink-dim);line-height:1.55;padding-left:16px;border-left:2px solid var(--accent);}
  .source b{color:var(--ink);font-weight:600;font-family:'Special Elite',monospace;}
  .source .meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);display:block;margin-bottom:3px;}
  .source a{color:var(--accent);}

  .related{display:flex;gap:8px;flex-wrap:wrap;}
  .related a{font-family:'JetBrains Mono',monospace;font-size:11.5px;background:var(--accent-soft);color:var(--accent);padding:7px 13px;border-radius:20px;text-decoration:none;font-weight:600;transition:background .15s,color .15s;}
  .related a:hover{background:var(--accent);color:#fff;}

  /* ---------- identification libre ---------- */
  .id-card{background:var(--surface);border:1.5px solid var(--border);border-radius:8px;max-width:640px;overflow:hidden;}
  .id-band{height:6px;background:#6B7A5E;}
  .id-inner{padding:38px clamp(20px,4vw,50px);}
  .id-eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);margin:0 0 16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .id-situation{font-size:16px;line-height:1.75;margin:0 0 26px;}
  .id-row{display:flex;gap:10px;margin-bottom:6px;}
  .id-input{flex:1;background:#F7F5F0;border:1.5px solid var(--border);color:var(--ink);padding:12px 14px;border-radius:6px;font-size:14.5px;font-family:'Source Serif 4',serif;}
  .id-input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .id-btn{background:var(--accent);color:#fff;border:none;font-weight:600;padding:0 22px;border-radius:6px;cursor:pointer;font-size:13px;font-family:'JetBrains Mono',monospace;}
  .id-btn:hover{background:#8E3220;}
  .id-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .id-feedback{font-size:13.5px;line-height:1.55;margin-top:16px;padding:14px 16px;border-radius:6px;display:none;font-family:'Source Serif 4',serif;}
  .id-feedback.hint{display:block;background:var(--accent-soft);border:1px solid var(--accent);}
  .id-feedback.correct{display:block;background:var(--good-soft);border:1px solid var(--good);}
  .id-feedback.reveal{display:block;background:var(--wrong-soft);border:1px solid var(--wrong);}
  .id-feedback b{font-family:'Special Elite',monospace;color:var(--accent);}
  .id-next{margin-top:18px;}

  /* ---------- quiz global ---------- */
  .quiz-progress{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-dim);margin-bottom:14px;text-transform:uppercase;letter-spacing:.04em;}
  .quiz-progress b{color:var(--accent);}
  .quiz-origin{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-dim);margin-top:10px;}
  .quiz-end{text-align:center;padding:50px 20px;background:var(--surface);border:1.5px solid var(--border);border-radius:8px;}
  .quiz-end .score{font-family:'Special Elite',monospace;font-weight:400;font-size:48px;color:var(--accent);margin:6px 0 10px;}
  .quiz-end p{color:var(--ink-dim);font-size:14.5px;max-width:420px;margin:0 auto 22px;line-height:1.55;}

  /* ---------- a-propos ---------- */
  .apropos p{font-size:15.5px;line-height:1.75;max-width:680px;margin:0 0 20px;}
  .apropos h2{font-family:'Special Elite',monospace;font-weight:400;font-size:18px;margin:34px 0 12px;}

  footer{text-align:center;color:var(--ink-dim);font-size:.85rem;padding:40px 20px 60px;line-height:1.7;}
  footer a{color:var(--accent);text-decoration:none;font-weight:600;}
  footer a:hover{text-decoration:underline;}

  @media (max-width:640px){
    .hero{grid-template-columns:1fr;}
  }
  @media (prefers-reduced-motion: reduce){
    .card, .scan-ring, .catcard{transition:none;}
  }
</style>
</head>
<body>
<a class="back-hub" href="../index.html" data-i18n="back">← Retour aux jeux</a>

<div class="topbar">
  <a class="brand" href="#/"><span class="dot"></span>Cobaye</a>
  <nav class="tabs" id="mainnav" data-i18n-aria-label="nav" aria-label="Navigation principale">
    <a class="tab" href="#/experiences" data-i18n="tabExplore">Explorer</a>
    <a class="tab" href="#/categories" data-i18n="tabCategories">Catégories</a>
    <a class="tab" href="#/quiz" data-i18n="tabQuiz">Quiz</a>
    <a class="tab" href="#/identification" data-i18n="tabIdentification">Identifie l'étude</a>
    <a class="tab" href="#/a-propos" data-i18n="tabAbout">À propos</a>
  </nav>
  <button class="rand-btn" id="rand-btn" type="button" data-i18n="randomBtn">🎲 Étude aléatoire</button>
</div>

<main id="app" class="wrap"></main>

<footer>
  <p><span data-i18n="by">par</span> <a href="https://antoninatger.com" target="_blank">Antonin Atger</a></p>
  <p class="mono" data-i18n="footerTag">Cobaye — {n} expériences recensées à ce jour, sources vérifiées une à une.</p>
</footer>

<script src="../i18n.js"></script>
<script>
I18N.register({
  fr: {
    back: "← Retour aux jeux", nav: "Navigation principale",
    tabExplore: "Explorer", tabCategories: "Catégories", tabQuiz: "Quiz",
    tabIdentification: "Identifie l'étude", tabAbout: "À propos",
    randomBtn: "🎲 Étude aléatoire", by: "par",
    footerTag: "Cobaye — {n} expériences recensées à ce jour, sources vérifiées une à une."
  },
  en: {
    back: "← Back to games", nav: "Main navigation",
    tabExplore: "Explore", tabCategories: "Categories", tabQuiz: "Quiz",
    tabIdentification: "Name the study", tabAbout: "About",
    randomBtn: "🎲 Random study", by: "by",
    footerTag: "Cobaye — {n} experiments catalogued so far, sources verified one by one."
  }
});
document.write('<scr' + 'ipt src="' + (I18N.lang === 'en' ? 'data-en.js' : 'data.js') + '"><\/scr' + 'ipt>');
document.write('<scr' + 'ipt src="' + (I18N.lang === 'en' ? 'app-en.js' : 'app.js') + '"><\/scr' + 'ipt>');
</script>
<script>
/* Compteur de contenu : le pied de page reflete le nombre reel d'entrees. */
window.addEventListener('load', function () {
  var el = document.querySelector('[data-i18n="footerTag"]');
  if (!el) return;
  var n = (typeof EXPERIENCES !== 'undefined' && EXPERIENCES.length) || 0;
  if (n) el.textContent = el.textContent.replace('{n}', n);
});
</script>
</body>
</html>
