<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Faux documents · Jeux et ressources pédagogiques</title>
<meta name="description" content="Créer une fausse une de journal, un faux post, une fausse affiche, une fausse fiche d'encyclopédie ou un faux article de presse pour la classe : image à télécharger, impression ou projection.">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
/* =====================================================================
   Faux documents — générateur de faux documents pour la classe.
   Même famille que faux-messages.html : une page autonome, rien n'est
   envoyé sur Internet, export en image (html2canvas servi depuis vendor/).
   Chaque gabarit est un pastiche : aucun nom, logo ni marque réels.
   ===================================================================== */
:root{--bg:#f4f1ea;--panel:#fff;--ink:#1d1b18;--doux:#6b665d;--bord:#e2ddd2;--acc:#1f6f5c;--acc2:#e9f3ef;--warn:#b3261e;--r:12px}
@media (prefers-color-scheme:dark){:root{--bg:#16150f;--panel:#201e19;--ink:#f1ede4;--doux:#a8a196;--bord:#38352d;--acc:#5cc4a6;--acc2:#1f3530}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.haut{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--bord);background:var(--panel);position:sticky;top:0;z-index:20}
.haut h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.haut a.retour{color:var(--acc);font-size:13.5px;text-decoration:none;white-space:nowrap;border:1px solid var(--bord);border-radius:8px;padding:5px 9px}
.btn{border:1px solid var(--bord);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap;min-height:36px}
.btn:hover{border-color:var(--acc)}
.btn.prim{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){.btn.prim{color:#0d1f1a}}
.btn.mini{padding:4px 9px;font-size:13px;min-height:32px}
.btn.warn{color:var(--warn)}
input:focus,select:focus,textarea:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--bord);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.4}
input[type=file]{display:none}
@media (max-width:520px){ .haut h1{display:none} .haut .langue{margin-left:auto} }

/* ---------- Choix du gabarit ---------- */
.gabarits{max-width:1280px;margin:0 auto;padding:16px 20px 0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.gab{border:1px solid var(--bord);background:var(--panel);border-radius:var(--r);padding:8px 8px 9px;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13.5px;font-weight:600}
.gab:hover{border-color:var(--acc)}
.gab[aria-pressed=true]{border-color:var(--acc);background:var(--acc2);box-shadow:inset 0 0 0 1px var(--acc)}
.gab svg{width:100%;max-width:120px;height:62px;display:block}
@media (max-width:720px){
  .gabarits{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:104px;overflow-x:auto;padding:12px 16px 2px;scrollbar-width:none}
  .gab svg{height:48px}
  .gab{font-size:12.5px}
}

/* ---------- Mise en page ---------- */
.page{display:grid;grid-template-columns:360px minmax(0,1fr);gap:24px;max-width:1280px;margin:0 auto;padding:16px 20px 30px}
.form{align-self:start;position:sticky;top:66px;max-height:calc(100vh - 80px);overflow:auto;padding-right:4px}
.bloc{background:var(--panel);border:1px solid var(--bord);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.bloc>summary,.bloc h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--doux);margin:0;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.bloc>summary::after{content:"+";font-size:16px;line-height:1}
.bloc[open]>summary::after{content:"–"}
.bloc[open]>summary,.bloc h2{margin-bottom:8px}
.champ{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--doux);margin-top:8px}
.champ:first-of-type{margin-top:0}
.champ .ex{font-size:11.5px;opacity:.85}
.champ.case{flex-direction:row;align-items:center;gap:7px;color:var(--ink);font-size:13.5px}
.champ.case input{width:18px;height:18px;margin:0}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.duo .champ{margin-top:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .btn{flex:1;font-size:13px}
.seg .btn[aria-pressed=true]{background:var(--acc2);border-color:var(--acc);font-weight:600}
.barre-ed{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.barre-ed .btn{padding:2px 8px;min-height:28px;font-size:12.5px}
.decor{background:var(--acc2);border-color:var(--acc)}
.img-champ{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.img-champ .vign{width:46px;height:46px;border-radius:8px;object-fit:cover;border:1px solid var(--bord)}
.aide{font-size:12.5px;color:var(--doux);margin:6px 0 0}
.outils{display:flex;gap:6px;flex-wrap:wrap}

.apercu{min-width:0;display:flex;flex-direction:column;align-items:center;gap:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.cadre{width:100%;display:flex;justify-content:center}
.cadre-in{transform-origin:top left;flex:none}
.cadre .doc{box-shadow:0 10px 34px rgba(0,0,0,.18)}
.astuce{font-size:12.5px;color:var(--doux);text-align:center;max-width:520px;margin:0}
.doc [data-k]{cursor:pointer}
.doc [data-k]:hover{outline:2px dashed rgba(245,159,0,.8);outline-offset:2px}
.doc.export [data-k]:hover,#projo .doc [data-k]:hover{outline:0}
@media (max-width:900px){
  .page{display:flex;flex-direction:column-reverse;padding:12px 16px 24px;gap:14px}
  .form{position:static;max-height:none;overflow:visible;padding:0;width:100%}
  .astuce{display:none}
}

#msgBox{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:calc(100vw - 30px);text-align:center}
#msgBox.on{opacity:1}
#projo{position:fixed;inset:0;background:#18181b;z-index:50;display:none;align-items:center;justify-content:center;overflow:hidden}
#projo.on{display:flex}
#projo .cadre-in{transform-origin:center center}
#projo .fermer{position:fixed;top:12px;right:12px;background:#27272a;border-color:#3f3f46;color:#eee;z-index:2}

/* ---------- Mention « document fictif » (image et impression seulement) ---------- */
.fictif{display:none;position:absolute;right:10px;bottom:6px;font:600 9px/1 system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;opacity:.55;z-index:5}
.doc.export .fictif{display:block}
/* html2canvas dessine mal les césures automatiques : on les coupe pour l'image */
.doc.export *{hyphens:manual!important;-webkit-hyphens:manual!important}
.doc{position:relative;overflow:hidden;flex:none}
.doc img{display:block}
.vide{display:none}

/* =====================================================================
   1. UNE DE JOURNAL
   ===================================================================== */
.une{width:820px;background:#fbfaf5;color:#121212;padding:30px 38px 26px;font-family:'Source Serif 4',Georgia,serif}
.une .u-tete{display:grid;grid-template-columns:150px 1fr 150px;align-items:center;gap:14px}
.une .u-oreille{border:1px solid #121212;padding:7px 8px;font:600 10.5px/1.3 'DM Sans',Arial,sans-serif;text-transform:uppercase;letter-spacing:.04em;text-align:center}
.une .u-oreille b{display:block;font:400 18px/1.1 'Playfair Display',serif;text-transform:none;letter-spacing:0;margin-top:3px}
.une .u-titre-j{font:700 68px/1 'Playfair Display',Georgia,serif;text-align:center;margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;min-width:0}
.une .u-devise{text-align:center;font-style:italic;font-size:12.5px;margin:6px 0 8px;color:#444}
.une .u-filet{display:flex;justify-content:space-between;border-top:1px solid #121212;border-bottom:4px double #121212;padding:5px 2px;font:600 11px/1.2 'DM Sans',Arial,sans-serif;text-transform:uppercase;letter-spacing:.08em}
.une .u-corps{display:grid;grid-template-columns:minmax(0,1fr) 214px;gap:24px;margin-top:20px}
.une .u-rub{font:700 12px/1 'DM Sans',Arial,sans-serif;text-transform:uppercase;letter-spacing:.12em;color:#b3001b;margin-bottom:8px}
.une .u-titre{font:700 47px/1.04 'Playfair Display',Georgia,serif;margin:0 0 12px;letter-spacing:-.01em}
.une .u-chapo{font:500 18px/1.4 'Fraunces',Georgia,serif;margin:0 0 14px}
.une .u-fig{margin:0 0 14px}
.une .u-fig img{width:100%;height:320px;object-fit:cover;filter:saturate(.85) contrast(1.03)}
.une .u-fig figcaption{font:400 11px/1.35 'DM Sans',Arial,sans-serif;color:#555;margin-top:5px;font-style:italic}
.une .u-texte{column-count:2;column-gap:22px;column-rule:1px solid #d8d5cc;font-size:13.6px;line-height:1.52;text-align:justify;hyphens:auto}
.une .u-texte p{margin:0 0 8px}
.une .u-texte p:first-child::first-letter{font:700 52px/.85 'Playfair Display',serif;float:left;margin:4px 6px 0 0}
.une .u-signe{font:700 11px/1 'DM Sans',Arial,sans-serif;text-transform:uppercase;letter-spacing:.08em;margin:0 0 8px;column-span:all}
.une .u-suite{font:italic 12px/1.3 'Source Serif 4',serif;color:#444}
.une .u-side{border-left:1px solid #121212;padding-left:20px}
.une .u-side .u-lab{font:700 11px/1 'DM Sans',Arial,sans-serif;text-transform:uppercase;letter-spacing:.14em;border-bottom:3px solid #121212;padding-bottom:6px;margin-bottom:10px}
.une .u-breve{border-bottom:1px solid #cfccc2;padding-bottom:12px;margin-bottom:12px}
.une .u-breve:last-child{border:0}
.une .u-breve h3{font:700 19px/1.15 'Playfair Display',serif;margin:0 0 6px}
.une .u-breve p{font-size:12.8px;line-height:1.45;margin:0}
.une .u-pied{margin-top:20px;border-top:3px solid #121212;padding-top:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;font:600 12px/1.3 'DM Sans',Arial,sans-serif}
.une .u-pied span{display:block;color:#b3001b;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px}
/* Variante tabloïd */
.une.tabloid{background:#fff;font-family:'DM Sans',Arial,sans-serif;padding-top:24px}
.une.tabloid .u-tete{grid-template-columns:1fr 170px}
.une.tabloid .u-oreille:first-child{display:none}
.une.tabloid .u-titre-j{background:#d6001c;color:#fff;font:400 74px/1 'Alfa Slab One',serif;text-align:left;padding:10px 18px 12px;letter-spacing:-.01em;text-transform:uppercase}
.une.tabloid .u-oreille{background:#ffe100;border:0;transform:rotate(4deg);padding:12px 8px;font-size:11px;box-shadow:3px 3px 0 #121212}
.une.tabloid .u-oreille b{font:400 22px/1 'Alfa Slab One',serif}
.une.tabloid .u-devise{text-align:left;font-style:normal;font-weight:600;margin:6px 0 6px}
.une.tabloid .u-filet{border-top:0;border-bottom:3px solid #121212;background:#121212;color:#fff;padding:6px 10px}
.une.tabloid .u-rub{display:inline-block;background:#121212;color:#fff;padding:6px 9px}
.une.tabloid .u-titre{font:400 62px/.96 'Alfa Slab One',serif;text-transform:uppercase;letter-spacing:-.01em}
.une.tabloid .u-chapo{font:700 19px/1.35 'DM Sans',Arial,sans-serif;background:#ffe100;display:inline;box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:2px 6px;line-height:1.6}
.une.tabloid .u-chapo-w{margin-bottom:14px}
.une.tabloid .u-fig img{filter:saturate(1.15) contrast(1.05);height:340px}
.une.tabloid .u-texte{font-family:'DM Sans',Arial,sans-serif;font-size:13.4px;text-align:left}
.une.tabloid .u-texte p:first-child::first-letter{font:400 46px/.9 'Alfa Slab One',serif;color:#d6001c}
.une.tabloid .u-side{border:0;padding:0}
.une.tabloid .u-side .u-lab{background:#d6001c;color:#fff;border:0;padding:7px 9px}
.une.tabloid .u-breve{border:2px solid #121212;padding:10px;margin-bottom:12px}
.une.tabloid .u-breve:last-child{border:2px solid #121212}
.une.tabloid .u-breve h3{font:400 18px/1.1 'Alfa Slab One',serif;text-transform:uppercase}
.une.tabloid .u-pied{border-top:6px solid #d6001c}
.une.tabloid .u-pied span{color:#d6001c}

/* =====================================================================
   2. ARTICLE DE PRESSE EN LIGNE
   ===================================================================== */
.article{width:860px;background:#fff;color:#1a1a1a;font-family:'Source Serif 4',Georgia,serif;--a:#c8102e}
.article.c-bleu{--a:#1a4f9c}.article.c-vert{--a:#0f7b5f}.article.c-noir{--a:#111}
.article .a-nav{background:#e8e8eb;padding:9px 14px;display:flex;align-items:center;gap:12px;font:13px/1 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#333}
.article .a-pts{display:flex;gap:7px}
.article .a-pts i{width:12px;height:12px;border-radius:50%;background:#ff5f57}
.article .a-pts i:nth-child(2){background:#febc2e}.article .a-pts i:nth-child(3){background:#28c840}
.article .a-fl{color:#888;letter-spacing:6px}
.article .a-url{flex:1;background:#fff;border-radius:16px;padding:7px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#444}
.article .a-url b{font-weight:400;color:#111}
.article .a-url svg{width:11px;height:11px;vertical-align:-1px;margin-right:6px}
.article .a-site{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:18px 32px 14px;font-family:'DM Sans',Arial,sans-serif}
.article .a-menu{font-size:13px;display:flex;align-items:center;gap:8px;color:#333}
.article .a-menu svg{margin-right:4px}
.article .a-logo{font:700 38px/1 'Playfair Display',Georgia,serif;letter-spacing:-.01em;white-space:nowrap}
.article .a-compte{justify-self:end;display:flex;gap:12px;align-items:center;font-size:13px}
.article .a-abo{background:var(--a);color:#fff;font-weight:700;padding:8px 13px;border-radius:3px}
.article .a-rubs{display:flex;justify-content:center;gap:22px;border-top:1px solid #e3e3e3;border-bottom:1px solid #e3e3e3;padding:10px 0;font:600 12.5px/1 'DM Sans',Arial,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:#444}
.article .a-rubs .on{color:var(--a);border-bottom:3px solid var(--a);padding-bottom:7px;margin-bottom:-10px}
.article .a-main{padding:28px 92px 34px}
.article .a-rub{font:700 13px/1 'DM Sans',Arial,sans-serif;color:var(--a);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.article .a-titre{font:700 40px/1.12 'Playfair Display',Georgia,serif;margin:0 0 14px;letter-spacing:-.005em}
.article .a-chapo{font-size:19.5px;line-height:1.45;color:#333;margin:0 0 16px}
.article .a-reserve{display:inline-flex;align-items:center;gap:7px;font:700 12.5px/1 'DM Sans',Arial,sans-serif;margin-bottom:14px}
.article .a-reserve i{width:12px;height:12px;border-radius:50%;background:#f2c200}
.article .a-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid #e3e3e3;padding-top:12px;font:13px/1.4 'DM Sans',Arial,sans-serif;color:#555}
.article .a-meta b{color:#111}
.article .a-partage{display:flex;gap:8px}
.article .a-partage span{width:32px;height:32px;border:1px solid #d5d5d5;border-radius:50%;display:grid;place-items:center;color:#333}
.article .a-partage svg{width:15px;height:15px}
.article .a-fig{margin:22px -92px 20px}
.article .a-fig img{width:100%;height:440px;object-fit:cover}
.article .a-fig figcaption{font:12.5px/1.4 'DM Sans',Arial,sans-serif;color:#666;padding:7px 92px 0}
.article .a-corps{font-size:17.5px;line-height:1.62;margin-top:22px}
.article .a-fig+.a-corps{margin-top:0}
.article .a-corps p{margin:0 0 16px}
.article .a-lire{border-left:3px solid var(--a);padding:2px 0 2px 14px;margin:0 0 18px;font:16px/1.35 'DM Sans',Arial,sans-serif}
.article .a-lire span{color:var(--a);font-weight:700;margin-right:6px}
.article .a-lire b{font-weight:700;color:#111}
.article .a-mur{position:relative}
.article .a-mur::before{content:"";position:absolute;left:0;right:0;top:-110px;height:110px;background:linear-gradient(rgba(255,255,255,0),#fff)}
.article .a-mur div{border-top:3px solid var(--a);background:#f6f5f2;padding:18px 22px;font:15px/1.45 'DM Sans',Arial,sans-serif;text-align:center}
.article .a-mur b{display:block;font:700 18px/1.3 'Playfair Display',serif;margin-bottom:4px}
.article .a-mur span{display:inline-block;margin-top:10px;background:var(--a);color:#fff;font-weight:700;padding:9px 18px;border-radius:3px}

/* =====================================================================
   3. POST DE RÉSEAU SOCIAL
   ===================================================================== */
.post{width:600px;background:#fff;color:#0f1419;padding:14px 18px 6px;font:15px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;--gris:#536471;--trait:#eff3f4;--lien:#1d9bf0}
.post.sombre{background:#000;color:#e7e9ea;--gris:#71767b;--trait:#2f3336}
.post .p-tete{display:flex;gap:10px;align-items:center}
.post .p-av{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;overflow:hidden}
.post .p-av img{width:100%;height:100%;object-fit:cover}
.post .p-id{flex:1;min-width:0;line-height:1.25}
.post .p-nom{font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:3px;white-space:nowrap}
.post .p-nom svg{width:18px;height:18px;flex:none}
.post .p-pseudo{color:var(--gris)}
.post .p-plus{display:flex;gap:14px;align-items:center;color:var(--gris)}
.post .p-suivre{background:#0f1419;color:#fff;font-weight:700;border-radius:999px;padding:7px 15px;font-size:14px}
.post.sombre .p-suivre{background:#eff3f4;color:#0f1419}
.post .p-texte{font-size:17px;line-height:1.42;margin:12px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.post .p-texte a,.fiche a,.post .p-lien{color:var(--lien);text-decoration:none}
.post .p-img{margin-top:12px;border:1px solid var(--trait);border-radius:16px;overflow:hidden}
.post .p-img img{width:100%;max-height:520px;object-fit:cover}
.post .p-meta{color:var(--gris);margin:14px 0 0;padding-bottom:14px;border-bottom:1px solid var(--trait)}
.post .p-meta b{color:inherit;font-weight:700}
.post .p-meta b,.post .p-chiffres b{color:#0f1419}
.post.sombre .p-meta b,.post.sombre .p-chiffres b{color:#e7e9ea}
.post .p-chiffres{display:flex;gap:20px;padding:12px 0;border-bottom:1px solid var(--trait);color:var(--gris);font-size:14.5px;flex-wrap:wrap}
.post .p-icos{display:flex;justify-content:space-around;padding:10px 0 6px;color:var(--gris)}
.post .p-icos svg{width:21px;height:21px}
.post .p-icos .aime{color:#f91880}

/* =====================================================================
   4. AFFICHE
   ===================================================================== */
.affiche{width:640px;height:905px;display:flex;flex-direction:column;text-align:center}
.affiche .f-titre{overflow-wrap:normal;word-break:normal;hyphens:none}
/* — Avis officiel — */
.affiche.avis{background:#f1e7cd;background-image:radial-gradient(rgba(120,90,40,.10) 1px,transparent 1.4px),radial-gradient(rgba(120,90,40,.07) 1px,transparent 1.2px),linear-gradient(160deg,#f6eed8,#eadcb8);background-size:9px 9px,13px 13px,100% 100%;color:#1c1813;padding:26px;font-family:'Source Serif 4',Georgia,serif}
.affiche.avis .f-in{flex:1;border:7px double #1c1813;padding:28px 34px 24px;display:flex;flex-direction:column;align-items:center}
.affiche.avis .f-sur{font:400 30px/1.1 'Alfa Slab One',serif;letter-spacing:.06em;text-transform:uppercase}
.affiche.avis .f-orn{width:70%;height:14px;margin:12px 0 16px;background:radial-gradient(circle,#1c1813 3px,transparent 3.5px) center/14px 14px repeat-x;position:relative}
.affiche.avis .f-orn::before,.affiche.avis .f-orn::after{content:"";position:absolute;top:6px;height:2px;width:38%;background:#1c1813}
.affiche.avis .f-orn::before{left:0}.affiche.avis .f-orn::after{right:0}

  styles:[['serieux','Quotidien','Broadsheet'],['tabloid','Tabloïd','Tabloid']],
  groupes:[['Article principal','Lead story'],['En-tête du journal','Masthead'],['Autres titres','Other stories']],

    C('texte','long','Texte de l’article','Article text',{rows:5,ex:{fr:'Un paragraphe par ligne.',en:'One paragraph per line.'}}),

    C('oreille','text','Encadré à droite du titre','Box beside the masthead',{g:1}),
    C('b1t','text','Brève 1 : titre','Brief 1: headline',{g:2}),C('b1','long','Brève 1 : texte','Brief 1: text',{g:2,rows:2}),
    C('b2t','text','Brève 2 : titre','Brief 2: headline',{g:2}),C('b2','long','Brève 2 : texte','Brief 2: text',{g:2,rows:2}),
    C('b3t','text','Brève 3 : titre','Brief 3: headline',{g:2}),C('b3','long','Brève 3 : texte','Brief 3: text',{g:2,rows:2}),
    C('pied','long','Bas de page (3 lignes « Rubrique : titre »)','Footer (3 lines “Section: headline”)',{g:2,rows:3})],
  L:{fr:{bref:'En bref',suite:'Suite page 4',par:'Par'},en:{bref:'In brief',suite:'Continued on page 4',par:'By'}},
  rendu(d,l,L){
    const br=[1,2,3].filter(i=>d['b'+i+'t']||d['b'+i]).map(i=>`<div class="u-breve">${k('b'+i+'t',esc(d['b'+i+'t']),'h3')}${k('b'+i,esc(d['b'+i]),'p')}</div>`).join('');
    const pied=paras(d.pied).slice(0,3).map(x=>{ const m=x.match(/^([^:]{1,30})\s*:\s*(.+)$/); return m?`<div><span>${esc(m[1])}</span>${esc(m[2])}</div>`:`<div>${esc(x)}</div>`; }).join('');
    const [o1,o2]=String(d.oreille||'').split(/\s*[|·]\s*/);
    return `<div class="doc une ${d.style==='tabloid'?'tabloid':''}">
      <div class="u-tete"><div class="u-oreille" data-k="numero">${esc(d.numero)}<b>${esc(d.prix)}</b></div><h2 class="u-titre-j" data-k="journal" data-fit="l">${esc(d.journal)}</h2><div class="u-oreille" data-k="oreille">${esc(o1||'')}${o2?`<b>${esc(o2)}</b>`:''}</div></div>
      ${k('devise',esc(d.devise),'div','u-devise')}
      <div class="u-filet"><span data-k="date">${esc(d.date)}</span><span data-k="numero">${esc(d.numero)}</span><span data-k="prix">${esc(d.prix)}</span></div>
      <div class="u-corps"><div>
        ${d.rubrique?k('rubrique',esc(d.rubrique),'div','u-rub'):''}
        ${k('titre',esc(d.titre),'h1','u-titre')}
        <div class="u-chapo-w">${k('chapo',esc(d.chapo),'p','u-chapo')}</div>
        ${d.image?`<figure class="u-fig" data-k="image"><img src="${d.image}" alt="">${d.legende?`<figcaption data-k="legende">${esc(d.legende)}</figcaption>`:''}</figure>`:''}
        <div class="u-texte" data-k="texte">${d.auteur?`<div class="u-signe" data-k="auteur">${L.par} ${esc(d.auteur)}</div>`:''}${P(d.texte)}<p class="u-suite">${L.suite}</p></div>
      </div>${br?`<aside class="u-side"><div class="u-lab">${L.bref}</div>${br}</aside>`:''}</div>
      ${pied?`<div class="u-pied" data-k="pied">${pied}</div>`:''}</div>`;
  },
  ex:{fr:{style:'serieux',journal:"L'Écho du Matin",devise:"Quotidien d'information fondé en 1924",date:'Lundi 3 novembre 2026',numero:'N° 31 447',prix:'2,90 €',oreille:'Supplément · Spécial rentrée',
      rubrique:'Santé',titre:'Le chocolat noir ferait gagner deux points de moyenne aux collégiens',
      chapo:"Selon une étude menée sur trente élèves, ceux qui mangent deux carrés de chocolat chaque matin obtiendraient de meilleures notes. Les spécialistes appellent à la prudence.",
      image:ILLU_CHOCO,legende:'Selon les auteurs de l’étude, deux carrés suffiraient. (Illustration)',auteur:'Claire Montel',
      texte:"C'est une annonce qui a fait le tour des cours de récréation. D'après les travaux d'un institut privé, les élèves ayant consommé du chocolat noir au petit-déjeuner pendant trois semaines auraient vu leur moyenne progresser de près de deux points.\nL'étude, financée par un fabricant de confiseries, n'a porté que sur une seule classe. Aucun groupe témoin n'a été constitué, et les notes ont été comparées à celles du trimestre précédent, réputé plus difficile.\n« Le cacao contient bien des molécules intéressantes, mais on ne peut rien conclure d'un échantillon aussi petit », tempère une chercheuse en nutrition, qui rappelle que le sommeil et l'alimentation générale pèsent bien davantage sur la concentration.\nDans les supermarchés, plusieurs enseignes ont pourtant déjà installé des têtes de gondole « spécial réussite scolaire ».",
      b1t:'Une grenouille fluorescente découverte en Guyane',b1:"Des naturalistes ont identifié une espèce qui brille sous lumière ultraviolette.",
      b2t:'La Loire à son plus bas niveau depuis 1976',b2:"Les arrêtés de restriction d'eau sont prolongés dans six départements.",
      b3t:'Le club de Saint-Arnoux en finale régionale',b3:"Les handballeuses joueront samedi devant un public déjà conquis.",
      pied:"Économie : la baguette à 1,50 €, vraiment ?\nCulture : le retour des cinémas de quartier\nSport : les secrets d'une remontada"},
    en:{style:'serieux',journal:'The Daily Lantern',devise:'An independent newspaper since 1924',date:'Monday, November 3, 2026',numero:'No. 31,447',prix:'$2.50',oreille:'Free inside · Back to school',
      rubrique:'Health',titre:'Dark chocolate “boosts pupils’ grades by two points”',
      chapo:'A study of thirty pupils claims that two squares of chocolate every morning lead to better marks. Experts urge caution.',
      image:ILLU_CHOCO,legende:'Two squares a day are enough, according to the study’s authors. (Illustration)',auteur:'Claire Montel',
      texte:"The announcement has spread across every playground. According to a private institute, pupils who ate dark chocolate at breakfast for three weeks saw their average grade rise by almost two points.\nThe study, funded by a confectionery maker, involved a single class. There was no control group, and grades were compared with the previous term, known to be harder.\n“Cocoa does contain interesting molecules, but you cannot conclude anything from such a small sample,” says a nutrition researcher, who points out that sleep and overall diet matter far more for concentration.\nSeveral supermarkets have nonetheless set up “exam success” chocolate displays.",
      b1t:'Glowing frog discovered in French Guiana',b1:'Naturalists have identified a species that shines under ultraviolet light.',

      b3t:'Local team reaches regional final',b3:'The handball squad will play on Saturday in front of a home crowd.',

  styles:[['rouge','Rouge','Red'],['bleu','Bleu','Blue'],['vert','Vert','Green'],['noir','Noir','Black']],
  groupes:[["L'article",'The article'],['Le site','The website']],

    C('texte','long','Texte de l’article','Article text',{rows:6,outils:['gras'],ex:{fr:'Un paragraphe par ligne.',en:'One paragraph per line.'}}),
    C('auteur','text','Auteur','Author'),C('date','text','Publié le','Published'),

    const url=`${esc(d.domaine||'')}/<b>${esc(slug(d.rubrique))}/article/2026/11/03/${esc(slug(d.titre).slice(0,60))}</b>`;
    return `<div class="doc article c-${d.style||'rouge'}">
      <div class="a-nav"><div class="a-pts"><i></i><i></i><i></i></div><span class="a-fl">‹ ›</span><div class="a-url" data-k="domaine">${ICO.cadenas}${url}</div></div>
      <div class="a-site"><div class="a-menu"><svg width="18" height="14" viewBox="0 0 18 14"><path d="M0 1h18M0 7h18M0 13h18" stroke="#202122" stroke-width="2"/></svg>${L.menu}</div>${k('site',esc(d.site),'div','a-logo')}<div class="a-compte"><span>${L.cnx}</span><span class="a-abo">${L.abo}</span></div></div>
      <div class="a-rubs" data-k="menu">${menu.map(m=>`<span class="${slug(m)===slug(d.rubrique)?'on':''}">${esc(m)}</span>`).join('')}</div>
      <div class="a-main">
        ${k('rubrique',esc(d.rubrique),'div','a-rub')}
        ${k('titre',esc(d.titre),'h1','a-titre')}
        ${k('chapo',esc(d.chapo),'p','a-chapo')}
        ${d.abonnes?`<div class="a-reserve" data-k="abonnes"><i></i>${L.reserve}</div>`:''}
        <div class="a-meta"><span><span data-k="auteur">${L.par} <b>${esc(d.auteur)}</b></span><br><span data-k="date">${L.pub} ${esc(d.date)}</span> · ${L.lect}</span>
          <div class="a-partage"><span>${ICO.lienp}</span><span>${ICO.mail}</span><span>${ICO.com}</span><span>${ICO.plume}</span></div></div>
        ${d.image?`<figure class="a-fig" data-k="image"><img src="${d.image}" alt="">${d.legende?`<figcaption data-k="legende">${esc(d.legende)}</figcaption>`:''}</figure>`:''}
        <div class="a-corps" data-k="texte">${corps}</div>
        ${d.abonnes?`<div class="a-mur" data-k="abonnes"><div><b>${L.reste}</b>${L.suite}<br><span>${L.abo}</span><br><small style="display:block;margin-top:8px;color:#555">${L.deja}</small></div></div>`:''}
      </div></div>`;
  },
  ex:{fr:{style:'rouge',site:'Le Matinal',domaine:'www.lematinal-info.fr',rubrique:'Éducation',menu:'International, Politique, Société, Éducation, Économie, Culture, Sport',
      titre:'Dormir en classe améliorerait la mémoire, selon une nouvelle étude',
      chapo:"Une équipe de chercheurs affirme que les élèves qui font une sieste pendant les cours retiennent mieux leurs leçons. Plusieurs établissements envisagent déjà d'installer des coussins.",
      auteur:'Julien Darcourt',date:'3 novembre 2026 à 07 h 12',lire:'Les écrans le soir, vraiment responsables des mauvaises notes ?',abonnes:true,image:'',legende:'',
      texte:"La nouvelle a de quoi réjouir les élèves. Selon une étude présentée la semaine dernière, **une sieste de vingt minutes en plein cours** permettrait de mieux mémoriser la leçon qui suit.\nLes chercheurs ont comparé deux groupes de douze volontaires, tous âgés de 19 à 23 ans, et non des collégiens. Le groupe « sieste » a mieux réussi un test de vocabulaire passé une heure plus tard.\nInterrogée, une enseignante sourit : « Encore faut-il que la sieste ne tombe pas pendant la leçon à retenir. »"},
    en:{style:'bleu',site:'The Daybreak',domaine:'www.thedaybreak-news.com',rubrique:'Education',menu:'World, Politics, Society, Education, Business, Culture, Sport',
      titre:'Sleeping in class boosts memory, new study claims',
      chapo:'A team of researchers says pupils who nap during lessons remember them better. Some schools are already thinking about buying cushions.',
      auteur:'Julian Dark',date:'November 3, 2026, 7:12 a.m.',lire:'Are screens at night really to blame for bad grades?',abonnes:true,image:'',legende:'',
      texte:"Pupils will be delighted. According to a study presented last week, **a twenty-minute nap in the middle of a lesson** helps people memorise what comes next.\nThe researchers compared two groups of twelve volunteers, all aged 19 to 23, not schoolchildren. The “nap” group did better on a vocabulary test taken an hour later.\nAsked about it, a teacher smiles: “As long as the nap doesn’t happen during the lesson they need to remember.”"}}

post:{fr:'Post de réseau social',en:'Social media post',

    C('image','image','Image jointe','Attached image'),

     en:{suivre:'Follow',vues:'Views',partages:'Reposts',citations:'Quotes',jaime:'Likes',signets:'Bookmarks'}},
  rendu(d,l,L){
    const txt=esc(d.texte).replace(/(https?:\/\/[^\s<]+|www\.[^\s<]+)/g,'<a>$1</a>').replace(/(^|[\s(])([#@][\p{L}\p{N}_]+)/gu,'$1<a>$2</a>');

      <div class="p-tete"><div class="p-av" data-k="avatar" style="background:hsl(${hue(d.nom)} 55% 45%)">${d.avatar?`<img src="${d.avatar}" alt="">`:ini}</div>

        <div class="p-plus"><span class="p-suivre">${L.suivre}</span><span style="font-size:20px;letter-spacing:1px">···</span></div></div>
      ${k('texte',txt,'div','p-texte')}
      ${d.image?`<div class="p-img" data-k="image"><img src="${d.image}" alt=""></div>`:''}
      <div class="p-meta"><span data-k="heure">${esc(d.heure)}</span> · <span data-k="date">${esc(d.date)}</span>${d.vues?` · <span data-k="vues"><b>${esc(d.vues)}</b> ${L.vues}</span>`:''}</div>
      <div class="p-chiffres">${ch('partages',L.partages)}${ch('citations',L.citations)}${ch('jaime',L.jaime)}${ch('signets',L.signets)}</div>
      <div class="p-icos">${ICO.rep}${ICO.rt}<span class="aime">${ICO.coeur}</span>${ICO.signet}${ICO.envoi}</div></div>`;
  },

      texte:"🚨 URGENT : le ministère vient de confirmer que TOUS les collèges seront fermés lundi à cause d'une alerte météo.\n\nPartagez avant que ce soit supprimé !! #alerte #collège",

fiche:{fr:'Fiche encyclopédie',en:'Encyclopedia page',
  styles:null,
  groupes:[["L'article",'The article'],['Encadré à droite','Infobox'],['Sources et bas de page','Sources and footer']],
  champs:[
    C('titre','text','Titre de la page','Page title'),
    C('texte','long','Texte de l’article','Article text',{rows:9,outils:['lien','gras','ital','note','section'],ex:{fr:'« ## Titre » crée une section, **gras**, [[lien]], [1] un appel de note.',en:'“## Heading” starts a section, **bold**, [[link]], [1] a footnote.'}}),
    C('boxt','text','Titre de l’encadré','Infobox title',{g:1}),C('image','image','Image','Image',{g:1}),C('legende','text','Légende','Caption',{g:1}),
    C('lignes','long','Lignes (une par ligne : « Nom : valeur »)','Rows (one per line: “Label: value”)',{g:1,rows:5,outils:['lien'],ex:{fr:'Une ligne « # Titre » crée un intertitre.',en:'A line “# Heading” adds a sub-heading.'}}),
    C('refs','long','Notes et références (une par ligne)','Notes and references (one per line)',{g:2,rows:3}),
    C('cats','text','Catégories (séparées par des virgules)','Categories (comma separated)',{g:2}),C('modif','text','Dernière modification','Last edited',{g:2})],
  L:{fr:{nom:'Encyclopédie',sous:'L’encyclopédie libre',cherche:'Rechercher dans l’Encyclopédie',btn:'Rechercher',liens:['Faire un don','Créer un compte','Se connecter'],
      art:'Article',disc:'Discussion',lire:'Lire',modif:'Modifier',hist:"Voir l'historique",langues:'🌐 24 langues',de:"Un article de l'Encyclopédie, l'encyclopédie libre.",
      somm:'Sommaire',refs:'Notes et références',cats:'Catégories',pied:'La dernière modification de cette page a été faite le'},
     en:{nom:'Encyclopedia',sous:'The free encyclopedia',cherche:'Search the Encyclopedia',btn:'Search',liens:['Donate','Create account','Log in'],
      art:'Article',disc:'Talk',lire:'Read',modif:'Edit',hist:'View history',langues:'🌐 24 languages',de:'From the Encyclopedia, the free encyclopedia.',
      somm:'Contents',refs:'References',cats:'Categories',pied:'This page was last edited on'}},
  rendu(d,l,L){
    const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/\[\[(.+?)\]\]/g,'<a>$1</a>').replace(/\[(\d+)\]/g,'<sup>[$1]</sup>');
    const lignes=paras(d.texte); const titres=[]; let corps='', premier=true, somm='';
    for(const x of lignes){
      if(/^##\s/.test(x)){ if(premier){ premier=false; corps+='%%SOMM%%'; } const t=x.replace(/^##\s*/,''); titres.push(t); corps+=`<h2>${inl(t)}</h2>`; }
      else if(/^###\s/.test(x)) corps+=`<h3>${inl(x.replace(/^###\s*/,''))}</h3>`;
      else corps+=`<p>${inl(x)}</p>`;

  document.querySelectorAll('[data-t]').forEach(el=>{ const v=t(el.dataset.t); if(el.dataset.attr) el.setAttribute(el.dataset.attr,v); else el.textContent=v; });
  $('langue').textContent=lang==='fr'?'EN':'FR'; $('langue').lang=lang==='fr'?'en':'fr'; $('langue').title=lang==='fr'?'English version':'Version française';
  $('gabarits').setAttribute('aria-label',t('nav')); $('form').setAttribute('aria-label',t('form'));
  document.title=(lang==='fr'?'Faux documents · Jeux et ressources pédagogiques':'Fake documents · Teaching games and resources');
}
function dessinerGabarits(){
  $('gabarits').innerHTML=Object.keys(G).map(g=>`<button class="gab" type="button" data-g="${g}" aria-pressed="${g===S.g}">${VIGN[g]}<span>${G[g][lang]}</span></button>`).join('');
  $('gabarits').querySelectorAll('.gab').forEach(b=>b.onclick=()=>{ S.g=b.dataset.g; garder(); tout(); });
}

/* ---------- Formulaire ---------- */
function champHTML(c,d){
  const id='f_'+c.k, lab=c[lang], ex=c.ex?`<span class="ex">${esc(c.ex[lang])}</span>`:'';
  if(c.type==='check') return `<label class="champ case"><input type="checkbox" id="${id}" data-c="${c.k}" ${d[c.k]?'checked':''}>${esc(lab)}</label>`;
  if(c.type==='image') return `<div class="champ"><span>${esc(lab)}</span><div class="img-champ">${d[c.k]?`<img class="vign" src="${d[c.k]}" alt="">`:''}<button class="btn mini" type="button" id="${id}" data-img="${c.k}">${t('photo')}</button>${d[c.k]?`<button class="btn mini warn" type="button" data-sans="${c.k}">${t('retirer')}</button>`:''}</div></div>`;
  if(c.type==='long') return `<label class="champ" for="${id}">${esc(lab)}</label>${c.outils?`<div class="barre-ed">${c.outils.map(o=>`<button type="button" class="btn mini" data-ed="${o}" data-cible="${id}">${t('b'+o[0].toUpperCase()+o.slice(1))}</button>`).join('')}</div>`:''}<label class="champ" style="margin-top:3px"><textarea id="${id}" data-c="${c.k}" rows="${c.rows||3}">${esc(d[c.k])}</textarea>${ex}</label>`;
  return `<label class="champ">${esc(lab)}<input type="text" id="${id}" data-c="${c.k}" value="${esc(d[c.k])}">${ex}</label>`;
}
function dessinerForm(){
  const g=G[S.g], d=S.docs[S.g];
  let h=`<section class="bloc decor"><h2>${t('decor')}</h2><p class="aide" style="margin:0 0 8px">${t('decorAide')}</p><button class="btn mini" type="button" id="bDecor">${t('decorBtn')}</button></section>`;
  if(g.styles) h+=`<section class="bloc"><h2>${t('style')}</h2><div class="seg">${g.styles.map(([v,fr,en])=>`<button class="btn" type="button" data-style="${v}" aria-pressed="${(d.style||g.styles[0][0])===v}">${lang==='fr'?fr:en}</button>`).join('')}</div></section>`;
  g.groupes.forEach((gr,i)=>{
    const ch=g.champs.filter(c=>c.g===i).map(c=>champHTML(c,d)).join('');
    h+=i===0?`<section class="bloc"><h2>${esc(gr[lang==='fr'?0:1])}</h2>${ch}</section>`:`<details class="bloc"><summary>${esc(gr[lang==='fr'?0:1])}</summary>${ch}</details>`;
  });
  h+=`<section class="bloc"><div class="outils"><button class="btn mini" type="button" id="bEx">${t('exemple')}</button><button class="btn mini warn" type="button" id="bVide">${t('vider')}</button><button class="btn mini" type="button" id="bSauve">${t('sauver')}</button><button class="btn mini" type="button" id="bOuvre">${t('ouvrir')}</button></div><p class="aide">${t('aideFichier')}</p></section>`;
  const f=$('form'); f.innerHTML=h;
  f.querySelectorAll('[data-c]').forEach(el=>el.addEventListener('input',()=>{ d[el.dataset.c]=el.type==='checkbox'?el.checked:el.value; S.modif[S.g]=true; rendre(); garder(); }));
  f.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{ d.style=b.dataset.style; S.modif[S.g]=true; f.querySelectorAll('[data-style]').forEach(x=>x.setAttribute('aria-pressed',x===b)); rendre(); garder(); });
  f.querySelectorAll('[data-img]').forEach(b=>b.onclick=()=>{ imgCle=b.dataset.img; $('fImg').value=''; $('fImg').click(); });
  f.querySelectorAll('[data-sans]').forEach(b=>b.onclick=()=>{ d[b.dataset.sans]=''; S.modif[S.g]=true; dessinerForm(); rendre(); garder(); });
  $('bEx').onclick=()=>{ S.docs[S.g]=exemple(S.g,lang); S.modif[S.g]=false; tout(); garder(); msg(t('okExemple')); };
  $('bDecor').onclick=()=>{ const cle=x=>x.journal||x.site||x.nom||x.sign||x.modif; let n, i=0; do n=DECOR[S.g].tirer(lang); while(cle(n)===cle(d)&&i++<8); Object.assign(d,n); dessinerForm(); rendre(); garder(); msg(t('okDecor')); };
  f.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>editer(b.dataset.ed,$(b.dataset.cible)));
  /* Pas de confirm() : un second clic confirme (la boîte native est bloquée dans certains cadres) */
  $('bVide').onclick=e=>{ const b=e.currentTarget; if(!b.dataset.arme){ b.dataset.arme=1; b.textContent=t('confirmer'); setTimeout(()=>{ if(b.isConnected){ delete b.dataset.arme; b.textContent=t('vider'); } },3000); return; } const n={style:d.style}; for(const c of g.champs) n[c.k]=DECOR[S.g].champs.includes(c.k)?d[c.k]:(c.type==='check'?false:''); S.docs[S.g]=n; S.modif[S.g]=true; tout(); garder(); };
  $('bSauve').onclick=()=>{ telecharger(nomFichier()+'.document.json',new Blob([JSON.stringify({type:'faux-document',v:1,g:S.g,d:S.docs[S.g]})],{type:'application/json'})); msg(t('okSauve')); };
  $('bOuvre').onclick=()=>{ $('fJson').value=''; $('fJson').click(); };
}

/* ---------- Mise en forme de la fiche : les boutons écrivent la syntaxe à la place du prof ---------- */
function editer(o,ta){
  if(!ta) return; const d=S.docs[S.g]; let a=ta.selectionStart, b=ta.selectionEnd, v=ta.value, sel=v.slice(a,b), ins, s0, s1;
  if(o==='lien'||o==='gras'||o==='ital'){
    const [g1,g2]=o==='lien'?['[[',']]']:o==='gras'?['**','**']:['*','*'];
    const mot=sel||t(o==='lien'?'motLien':'motGras'); ins=g1+mot+g2; s0=a+g1.length; s1=s0+mot.length;
  } else if(o==='note'){
    const n=(v.match(/\[(\d+)\]/g)||[]).reduce((m,x)=>Math.max(m,+x.slice(1,-1)),0)+1;
    ins=sel+'['+n+']'; a=b; sel=''; s0=s1=a+ins.length;
    const refs=paras(d.refs); while(refs.length<n) refs.push(t('nouvSource')); d.refs=refs.join('\n'); const fr=$('f_refs'); if(fr) fr.value=d.refs;
  } else {
    const avant=v.slice(0,a), pre=avant&&!avant.endsWith('\n')?'\n':''; const titre=sel||t('nouvSection'); ins=pre+'## '+titre+'\n'; s0=a+pre.length+3; s1=s0+titre.length;
  }
  ta.focus(); ta.setRangeText(ins,a,b,'end'); ta.setSelectionRange(s0,s1);
  d[ta.dataset.c]=ta.value; S.modif[S.g]=true; rendre(); garder();
}

/* ---------- Photos : réduites à 1600 px pour rester légères ---------- */
let imgCle='';
$('fImg').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ const m=1600, s=Math.min(1,m/Math.max(im.width,im.height)); const cv=document.createElement('canvas'); cv.width=Math.round(im.width*s); cv.height=Math.round(im.height*s); cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height); S.docs[S.g][imgCle]=cv.toDataURL('image/jpeg',.86); S.modif[S.g]=true; dessinerForm(); rendre(); garder(); }; im.src=r.result; }; r.readAsDataURL(f); };

/* ---------- Rendu et mise à l'échelle ---------- */
const htmlDoc=(g,opts={})=>{ let h=G[g].rendu(S.docs[g],lang,G[g].L[lang]); h=h.replace('<div class="doc ',`<div class="doc ${opts.export?'export ':''}`); return h.replace(/<\/div>\s*$/,`<div class="fictif">${t('fictif')}</div></div>`); };
function ajuster(hote,inner,largeur,hauteur){
  const doc=inner.firstElementChild; if(!doc) return;
  inner.style.transform='none'; const w=doc.offsetWidth, h=doc.offsetHeight;
  const s=Math.min(1,largeur/w,hauteur?hauteur/h:9);
  inner.style.transform=`scale(${s})`; inner.style.width=w+'px';
  if(hote){ hote.style.height=(h*s)+'px'; inner.style.marginRight=(w*s-w)+'px'; }
}
/* Les titres qui doivent tenir : nom du journal sur une ligne, titre d'affiche sans couper
   un mot et sans déborder de la feuille. On réduit le corps pas à pas. */
function caler(root){
  root.querySelectorAll('[data-fit]').forEach(el=>{
    el.style.fontSize=''; let fs=parseFloat(getComputedStyle(el).fontSize), n=0;
    const cadre=el.closest('.f-in');
    const trop=()=>{
      if(el.dataset.fit==='l') return el.scrollWidth>el.clientWidth+1;
      const r=document.createRange(); r.selectNodeContents(el); const w=el.clientWidth;
      for(const q of r.getClientRects()) if(q.width>w+2) return true;
      const mots=el.textContent.split(/\s+/); const m=document.createElement('span'); m.style.cssText='position:absolute;visibility:hidden;white-space:nowrap;font:inherit;text-transform:inherit;letter-spacing:inherit';
      el.appendChild(m); let deb=false; for(const x of mots){ m.textContent=x; if(m.offsetWidth>w+1){ deb=true; break; } } m.remove(); if(deb) return true;
      return cadre&&cadre.scrollHeight>cadre.clientHeight+1;
    };
    while(trop()&&fs>14&&n++<80){ fs-=2; el.style.fontSize=fs+'px'; }
  });
}
function rendre(){
  const inn=$('cadreIn'); inn.innerHTML=htmlDoc(S.g); inn.style.transform='none'; caler(inn);
  ajusterApercu();
  inn.querySelectorAll('img').forEach(i=>{ if(!i.complete) i.onload=ajusterApercu; });
}
function ajusterApercu(){ ajuster($('cadre'),$('cadreIn'),$('cadre').clientWidth); }
addEventListener('resize',()=>{ ajusterApercu(); if($('projo').classList.contains('on')) ajusterProjo(); });
/* Un clic dans le document mène au champ correspondant */
$('cadreIn').addEventListener('click',e=>{
  const el=e.target.closest('[data-k]'); if(!el) return;
  const c=G[S.g].champs.find(x=>x.k===el.dataset.k); if(!c) return;
  const f=$('f_'+c.k); if(!f) return;
  const det=f.closest('details'); if(det) det.open=true;
  f.scrollIntoView({block:'center',behavior:'smooth'}); setTimeout(()=>f.focus({preventScroll:true}),250);
});

/* ---------- Image, impression, projection ---------- */
function telecharger(nom,blob){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nom; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000); }
const nomFichier=()=>slug(S.docs[S.g].titre||S.docs[S.g].nom||G[S.g][lang]).slice(0,50)||'document';
$('png').onclick=async()=>{
  if(!window.html2canvas) return msg(t('noLib'));
  const hote=document.createElement('div'); hote.style.cssText='position:fixed;left:-10000px;top:0';
  hote.innerHTML=htmlDoc(S.g,{export:true}); document.body.appendChild(hote); caler(hote);
  try{
    await (document.fonts?document.fonts.ready:Promise.resolve());
    await Promise.all([...hote.querySelectorAll('img')].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r;})));
    /* html2canvas rend mal les images SVG (dégradés perdus) : on les passe d'abord en PNG */
    for(const i of hote.querySelectorAll('img[src^="data:image/svg"]')){ const cv=document.createElement('canvas'); cv.width=(i.naturalWidth||800)*2; cv.height=(i.naturalHeight||400)*2; cv.getContext('2d').drawImage(i,0,0,cv.width,cv.height); i.src=cv.toDataURL('image/png'); await new Promise(r=>{ if(i.complete) r(); else i.onload=i.onerror=r; }); }
    const cv=await html2canvas(hote.firstElementChild,{scale:2,backgroundColor:null,useCORS:true,logging:false});
    cv.toBlob(b=>{ telecharger(nomFichier()+'.png',b); msg(t('okImg')); },'image/png');
  }catch(x){ console.warn(x); msg(t('errImg')); }
  finally{ hote.remove(); }
};
$('imprimer').onclick=()=>window.print();
/* À l'impression, le document est ramené à la largeur utile d'une page A4 (≈ 720 px) */
addEventListener('beforeprint',()=>{ const inn=$('cadreIn'), w=inn.firstElementChild.offsetWidth, s=Math.min(1,720/w); inn.style.transform=`scale(${s})`; $('cadre').style.height=(inn.firstElementChild.offsetHeight*s)+'px'; $('cadre').style.justifyContent='flex-start'; });
addEventListener('afterprint',()=>{ $('cadre').style.justifyContent=''; ajusterApercu(); });
function ajusterProjo(){ ajuster(null,$('projoIn'),innerWidth-30,innerHeight-30); }
$('projeter').onclick=()=>{ $('projoIn').innerHTML=htmlDoc(S.g); $('projo').classList.add('on'); $('projoIn').style.transform='none'; caler($('projoIn')); $('projo').setAttribute('aria-hidden','false'); try{ document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){} ajusterProjo(); setTimeout(ajusterProjo,300); $('projoFin').focus(); };
function projoFin(){ $('projo').classList.remove('on'); $('projo').setAttribute('aria-hidden','true'); try{ document.fullscreenElement&&document.exitFullscreen(); }catch(e){} $('projeter').focus(); }
$('projoFin').onclick=projoFin;
addEventListener('keydown',e=>{ if(e.key==='Escape'&&$('projo').classList.contains('on')) projoFin(); });
document.addEventListener('fullscreenchange',()=>{ if($('projo').classList.contains('on')) setTimeout(ajusterProjo,50); });

/* ---------- Ouvrir un document enregistré ---------- */
$('fJson').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ const j=JSON.parse(await f.text()); if(j.type!=='faux-document'||!G[j.g]||!j.d) throw 0; S.g=j.g; S.docs[j.g]=j.d; S.modif[j.g]=true; tout(); garder(); msg(t('okOuvre')); }catch(x){ msg(t('errOuvre')); } };

/* ---------- Langue : les exemples non retouchés suivent la langue ---------- */
$('langue').onclick=()=>{
  lang=lang==='fr'?'en':'fr';
  try{ localStorage.setItem('faux-documents:lang',lang); }catch(e){}
  for(const g in G) if(!S.modif[g]) S.docs[g]=exemple(g,lang);
  const u=new URL(location.href); u.searchParams.set('lang',lang); history.replaceState(null,'',u);
  garder(); tout();
};

function tout(){ dessinerTextes(); dessinerGabarits(); dessinerForm(); rendre(); }
tout();
if(document.fonts) document.fonts.ready.then(rendre);
</script>
