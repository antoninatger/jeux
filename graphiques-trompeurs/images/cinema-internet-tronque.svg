<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 195" font-family="Nunito,Arial,sans-serif">
  <rect width="480" height="195" fill="#ffffff"/>
  <!-- Panel A: axe tronqué 2,6 à 3,4 -->
  <g>
    <text x="115" y="12" font-size="11" font-weight="700" text-anchor="middle" fill="#333">Axe de 2,6 à 3,4</text>
    <line x1="34" y1="15" x2="34" y2="140" stroke="#888" stroke-width="1"/>
    <line x1="34" y1="140" x2="196" y2="140" stroke="#888" stroke-width="1"/>
    <text x="30" y="18" font-size="8" text-anchor="end" fill="#666">3,4</text>
    <text x="30" y="49" font-size="8" text-anchor="end" fill="#666">3,2</text>
    <text x="30" y="80" font-size="8" text-anchor="end" fill="#666">3,0</text>
    <text x="30" y="112" font-size="8" text-anchor="end" fill="#666">2,8</text>
    <text x="30" y="143" font-size="8" text-anchor="end" fill="#666">2,6</text>
    <polyline points="34,46.25 66.4,77.5 98.8,93.125 131.2,61.875 163.6,93.125 196,108.75" fill="none" stroke="#4a7ebc" stroke-width="2"/>
    <g fill="#2c5a8c">
      <circle cx="34" cy="46.25" r="2.6"/><circle cx="66.4" cy="77.5" r="2.6"/><circle cx="98.8" cy="93.125" r="2.6"/>
      <circle cx="131.2" cy="61.875" r="2.6"/><circle cx="163.6" cy="93.125" r="2.6"/><circle cx="196" cy="108.75" r="2.6"/>
    </g>
    <g font-size="7.5" fill="#666" text-anchor="middle">
      <text x="34" y="155">2002</text><text x="66.4" y="155">2003</text><text x="98.8" y="155">2004</text>
      <text x="131.2" y="155">2005</text><text x="163.6" y="155">2006</text><text x="196" y="155">2007</text>
    </g>
    <text x="115" y="172" font-size="8" fill="#888" text-anchor="middle">Entrées par habitant (approx.)</text>
  </g>
  <!-- Panel B: axe honnête 0 à 10 -->
  <g transform="translate(250,0)">
    <text x="115" y="12" font-size="11" font-weight="700" text-anchor="middle" fill="#333">Axe de 0 à 10</text>
    <line x1="34" y1="15" x2="34" y2="140" stroke="#888" stroke-width="1"/>
    <line x1="34" y1="140" x2="196" y2="140" stroke="#888" stroke-width="1"/>
    <text x="30" y="18" font-size="8" text-anchor="end" fill="#666">10</text>
    <text x="30" y="43" font-size="8" text-anchor="end" fill="#666">8</text>
    <text x="30" y="68" font-size="8" text-anchor="end" fill="#666">6</text>
    <text x="30" y="93" font-size="8" text-anchor="end" fill="#666">4</text>
    <text x="30" y="118" font-size="8" text-anchor="end" fill="#666">2</text>
    <text x="30" y="143" font-size="8" text-anchor="end" fill="#666">0</text>
    <polyline points="34,100 66.4,102.5 98.8,103.75 131.2,101.25 163.6,103.75 196,105" fill="none" stroke="#4a7ebc" stroke-width="2"/>
    <g fill="#2c5a8c">
      <circle cx="34" cy="100" r="2.6"/><circle cx="66.4" cy="102.5" r="2.6"/><circle cx="98.8" cy="103.75" r="2.6"/>
      <circle cx="131.2" cy="101.25" r="2.6"/><circle cx="163.6" cy="103.75" r="2.6"/><circle cx="196" cy="105" r="2.6"/>
    </g>
    <g font-size="7.5" fill="#666" text-anchor="middle">
      <text x="34" y="155">2002</text><text x="66.4" y="155">2003</text><text x="98.8" y="155">2004</text>
      <text x="131.2" y="155">2005</text><text x="163.6" y="155">2006</text><text x="196" y="155">2007</text>
    </g>
    <text x="115" y="172" font-size="8" fill="#888" text-anchor="middle">Entrées par habitant (approx.)</text>
  </g>
</svg>
